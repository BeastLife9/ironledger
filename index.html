    '<div class="logbtns"><button class="btn primary" data-act="fs-open">+ Add food</button><button class="btn" data-act="fs-scan">' + ICON_BARCODE + (IN_CLAUDE && !P.scannerUrl ? ' Barcode' : ' Scan barcode') + '</button></div>' +
    (items.length ? '<ul class="loglist">' + items.map(x => '<li><span class="ln-t"><b>' + esc(x.name) + '</b><small class="num">' + (x.qty === 1 ? '' : x.qty + ' × ') + esc(x.serving) + ' · ' + Math.round(x.p * x.qty) + ' g protein</small></span><span class="num ln-k">' + n0(x.kcal * x.qty) + '</span><button class="icon-act like sm" data-act="logfav" data-id="' + esc(x.id) + '" aria-pressed="' + isFav(x) + '" aria-label="Favorite ' + esc(x.name) + '">' + ICON_HEART + '</button><button class="ln-x" data-act="logdel" data-id="' + esc(x.id) + '" aria-label="Remove ' + esc(x.name) + '">\u00d7</button></li>').join('') + '</ul>'
      : '<p class="small muted">Search anything you ate, scan a barcode, or add your own food. It all counts toward today\u2019s rings.</p>') + '</section>';

  const picks = (P.foodPicks || []).filter(k => FOODS[k]), liked = (P.mealLikes || []).length, hidden = (P.mealHide || []).length + (P.foodNope || []).length;
  h += '<div class="card-h sect">' + ttl('Meal ideas', 'portions') + '<span class="muted xs">Sized to your targets</span></div>' +
    '<button class="picks-bar" data-act="picks-open"><span class="pb-ic">' + ICON_HEART + '</span><span class="pb-t"><b>' + (picks.length ? 'Built around: ' + esc(picks.slice(0, 4).map(k => PICK_NAMES[k] || FOODS[k].n).join(', ')) + (picks.length > 4 ? ' +' + (picks.length - 4) : '') : 'Pick foods you like') + '</b>' +
    '<small>' + (picks.length || liked || hidden ? [liked ? liked + ' liked meal' + (liked > 1 ? 's' : '') : '', hidden ? hidden + ' skipped' : ''].filter(Boolean).join(' · ') || 'Tap to change your picks' : 'Meal ideas lean toward what you choose. Tap \u2665 on meals you like.') + '</small></span><span class="pb-go">Edit</span></button>' +
    '<ol class="meals">';
  meals.forEach(m => {
    const done = (fd.ate || []).includes(m.slot);
    const kp = m.p * 4, kc = m.c * 4, kf = m.fat * 9, kt = kp + kc + kf || 1;
    h += '<li class="meal' + (done ? ' done' : '') + '"><div class="meal-h"><span class="micon ' + m.kind + '">' + (done ? CHECK_SM : MEAL_ICON[m.kind]) + '</span><div><span class="eyebrow">' + esc(m.label) + '</span><h3>' + esc(m.n) + '</h3></div></div>' +
      '<div class="mbar" role="img" aria-label="Protein ' + m.p + ' g, carbs ' + m.c + ' g, fat ' + m.fat + ' g"><i class="p" style="width:' + (kp / kt * 100).toFixed(1) + '%"></i><i class="c" style="width:' + (kc / kt * 100).toFixed(1) + '%"></i><i class="f" style="width:' + (kf / kt * 100).toFixed(1) + '%"></i></div>' +
      '<p class="xs muted num"><b style="color:var(--ink)">' + n0(m.k) + ' cal</b> · ' + m.p + ' g protein · ' + m.c + ' g carbs · ' + m.fat + ' g fat</p>' +
      '<ul class="foods ing">' + m.items.map(i => { const lk = (P.foodPicks || []).includes(i.f); return '<li><span class="ing-n">' + esc(FOODS[i.f].n) + '</span><span class="num muted ing-q">' + esc(amtLabel(i.f, i.amt)) + '</span>' +
        '<span class="ing-a"><button class="ia like" data-act="flike" data-f="' + i.f + '" aria-pressed="' + lk + '" aria-label="' + (lk ? 'You like ' : 'Like ') + esc(FOODS[i.f].n) + '">' + ICON_HEART + '</button><button class="ia" data-act="fnope" data-f="' + i.f + '" data-slot="' + m.slot + '" aria-label="Don\u2019t use ' + esc(FOODS[i.f].n) + '">' + ICON_NOPE + '</button></span></li>'; }).join('') + '</ul>' +
      (m.trimmed && m.trimmed.length ? '<p class="xs muted">Made without ' + esc(m.trimmed.map(f => (PICK_NAMES[f] || FOODS[f].n).toLowerCase()).join(', ')) + ', which you skip.</p>' : '') +
      (m.limited ? '<p class="xs warn-t">Few options match your food limits here. Swap any item for a protein you eat.</p>' : '') +
      (m.est ? '<p class="xs muted">Dishes like this vary by place; the numbers are typical.</p>' : '') +
      (!done && m.tight ? '<p class="xs warn-t">You\u2019re near today\u2019s calories. Keep this one light, or skip it.</p>' : !done && m.fitted ? '<p class="xs muted">Resized to what\u2019s left today.</p>' : '') +
      '<div class="mrow-act"><button class="btn sm' + (done ? ' on' : '') + '" data-act="ate" data-slot="' + m.slot + '" aria-pressed="' + done + '">' + (done ? CHECK + ' Eaten' : 'Mark as eaten') + '</button>' +
      (m.choices > 1 ? '<button class="btn sm ghost" data-act="mealswap" data-slot="' + m.slot + '">Different idea</button>' : '<span></span>') +
      '<button class="icon-act like" data-act="mlike" data-id="' + m.id + '" aria-pressed="' + !!m.liked + '" aria-label="' + (m.liked ? 'Liked. Tap to unlike' : 'Like this meal') + '">' + ICON_HEART + '</button>' +
      (m.choices > 1 ? '<button class="icon-act" data-act="mhide" data-id="' + m.id + '" data-slot="' + m.slot + '" aria-label="Not for me: hide this meal">' + ICON_NOPE + '</button>' : '') + '</div></li>';
  });
  h += '</ol>';

  h += '<button class="picks-bar goal-bar" data-act="goal-open"><span class="pb-ic">' + ICON_SPARK + '</span><span class="pb-t"><b>Best foods ' + (regionOf(P) === 'eg' ? 'in Egypt ' : '') + 'for ' + GOAL_WORD[P.goal || 'leanbulk'] + '</b><small>What to eat more of, with calories and protein</small></span><span class="pb-go">Open</span></button>';
  const shop = shoppingList(P, T, todayKey(), 7, st.food);
  const buy = shop.filter(x => !x.pantry), pan = shop.filter(x => x.pantry);
  const row = x => '<li><span>' + esc(x.name) + '<small>Meals use ' + esc(x.need) + '</small></span><span class="num">' + esc(x.txt) + '</span></li>';
  h += '<details class="card shop" data-dk="shop"' + (S.det.shop ? ' open' : '') + '><summary><h2>Shopping list · 7 days</h2>' + CHEV + '</summary><p class="xs muted">Rounded up to what stores sell. Leftovers carry into next week.</p><ul class="foods shoplist">' +
    buy.map(row).join('') + '</ul>' +
    (pan.length ? '<div class="grp">Pantry: check you have these</div><ul class="foods shoplist">' + pan.map(x => '<li><span>' + esc(x.name) + '</span><span class="num muted">' + esc(x.txt) + ' this week</span></li>').join('') + '</ul>' : '') + '</details>';
  return h;
}

/* ================= BODY ================= */
function vBody(st) {
  const ctx = todayContext(st);
  const extra = doneDraftSets(ctx);
  const now = Date.now();
  const rec = recovery(st, now, extra);
  const fresh = st.sessions.length === 0 && !extra.length;
  const trained = Object.keys(MUSCLES).filter(m => rec.F[m] >= 3);
  const ready = Object.keys(MUSCLES).length - trained.filter(m => rec.R[m] < 90).length;
  let h = band({
    eyebrow: 'Recovery', title: 'What’s ready', plate: 'REST',
    sub: (fresh ? 'Log a workout and the map fills in.' : '<b>' + trained.filter(m => rec.R[m] < 60).length + '</b> tired · <b>' + trained.filter(m => rec.R[m] >= 60 && rec.R[m] < 90).length + '</b> recovering') + (rec.k > 1 ? '<br>Recovery times set for age ' + esc(st.profile.age) : ''),
    side: ringsSVG([{ v: ready, max: Object.keys(MUSCLES).length, color: 'var(--band-ink)' }], 96, '<b class="num">' + ready + '</b><small>ready</small>')
  });
  const todaySets = st.sessions.filter(s => s.date === todayKey()).reduce((a, s) => a.concat(s.sets), []).concat(extra);
  const today = setsByMuscle(todaySets);
  h += '<section class="card"><div class="seg" role="group" aria-label="Map view"><button data-act="bodymode" data-v="recovery" aria-pressed="' + (S.bodyMode === 'recovery') + '">Ready now</button><button data-act="bodymode" data-v="today" aria-pressed="' + (S.bodyMode === 'today') + '">Worked today</button></div>' +
    bodySVG(S.bodyMode === 'today' ? workFill(today) : recFill(rec)) +
    (S.bodyMode === 'today'
      ? (todaySets.length ? '' : '<p class="small muted center">No workout logged today yet. Muscles light up as you check off sets.</p>') + '<div class="legend"><span><i style="background:var(--muscle)"></i>Not worked</span><span><i style="background:color-mix(in srgb,var(--blue) 40%,var(--muscle))"></i>A little</span><span><i style="background:var(--blue)"></i>A lot</span></div>'
      : '<div class="legend"><span><i style="background:var(--green)"></i>Ready</span><span><i style="background:var(--yellow)"></i>Recovering</span><span><i style="background:var(--red)"></i>Tired</span><span><i style="background:var(--muscle)"></i>Not trained lately</span></div>') + '</section>';

  if (S.selMuscle) {
    const m = S.selMuscle;
    const hrs = hoursToReady(rec.F, m, 90, rec.k);
    const wk = setsByMuscle(setsSince(st, now - 7 * 864e5, extra))[m];
    const plan = plannedWeek(st, refWeek(st, now)).vol[m];
    h += '<section class="card"><div class="card-h">' + ttl(MUSCLES[m].n, 'recovery', m) + (prioOf(st.profile).includes(m) ? '<span class="tag pri">Focus</span>' : '') + '</div>' +
      '<div class="detail"><div class="stat"><b class="num">' + (rec.F[m] < 3 ? '100' : rec.R[m]) + '%</b><span>recovered</span></div><div class="stat"><b class="num">' + (hrs ? '~' + hrs + ' h' : 'Now') + '</b><span>until ready</span></div><div class="stat"><b class="num">' + r1n(wk) + (plan ? ' / ' + r1n(plan) : '') + '</b><span>sets this week</span></div></div>' +
      '<p class="small muted">Last trained ' + relTime(lastTrained(st, m)) + '.</p></section>';
  }
  const rows = trained.sort((a, b) => rec.R[a] - rec.R[b]);
  if (rows.length) {
    h += '<section class="card"><div class="card-h">' + ttl('Recovering', 'recovery') + '<span class="muted xs">Tap for detail</span></div><div class="mlist">' + rows.map(m => {
      const r = rec.R[m];
      return '<button class="mrow" data-act="muscle" data-m="' + m + '" aria-pressed="' + (S.selMuscle === m) + '"><span>' + MUSCLES[m].n + '</span><span class="meter"><i style="width:' + r + '%;background:' + recColor(r, rec.F[m]) + '"></i></span><span class="pct num">' + r + '%</span></button>';
    }).join('') + '</div></section>';
  }
  h += budgetCard(st, extra);
  return h;
}
function budgetCard(st, extra) {
  const bl = backLoad(setsSince(st, Date.now() - 7 * 864e5, extra));
  const budget = st.profile.backBudget || 24;
  const over = bl.total > budget, near = bl.total > budget * 0.85;
  const col = over ? 'var(--red)' : near ? 'var(--yellow)' : 'var(--green)';
  return '<section class="card"><div class="card-h">' + ttl('Lower-back stress', 'back') + '<span class="chip ' + (over ? 'bad' : near ? 'warn' : 'good') + '">' + (over ? 'Over the limit' : near ? 'Close to the limit' : 'Safe') + '</span></div>' +
    '<div class="budget"><div class="meter"><i style="width:' + Math.min(100, bl.total / budget * 100) + '%;background:' + col + '"></i></div><span class="xs muted num">' + bl.total + ' of ' + budget + ' points, last 7 days</span></div>' +
    '</section>';
}

/* ================= PROGRESS ================= */
function vProgress(st) {
  const now = Date.now();
  const rv = review(st, now);
  const days = daysFor(st.profile).length;
  const recent = st.sessions.filter(s => s.at >= now - 7 * 864e5).length;
  const plan = plannedWeek(st, refWeek(st, now)).vol;
  const vol = setsByMuscle(setsSince(st, now - 7 * 864e5, doneDraftSets(todayContext(st))));
  const pri = prioOf(st.profile);
  const fGot = pri.reduce((a, m) => a + Math.min(vol[m], plan[m]), 0), fNeed = pri.reduce((a, m) => a + plan[m], 0);
  const wt = weightTrend(st.weights, now, st.profile.scaleSince);
  let h = band({
    eyebrow: 'Progress · last 7 days', title: possessive(st.profile, 'week'), plate: 'PR',
    sub: '<b>' + recent + ' of ' + days + '</b> workouts<br><b>' + Math.round(fNeed ? fGot / fNeed * 100 : 0) + '%</b> of focus-muscle sets' + (wt ? '<br><b>' + sign(r1n(toU(wt.perWeek))) + ' ' + UNIT + '</b> a week' : ''),
    side: ringsSVG([{ v: recent, max: days, color: 'var(--band-ink)', track: 'var(--band-line)' }, { v: fGot, max: fNeed, color: 'var(--red)', track: 'var(--band-line)' }], 112, '<b class="num">' + recent + '/' + days + '</b><small>workouts</small>')
  });

  h += '<section class="card"><div class="card-h"><h2>This week’s fixes</h2></div>';
  if (rv.empty) h += '<p class="small muted">After a few workouts, this shows what to fix next week, with the exact change to make.</p>';
  else {
    const order = { bad: 0, warn: 1, good: 2 };
    const flags = rv.flags.slice().sort((a, b) => order[a.sev] - order[b.sev]);
    h += flags.length ? '<div class="flags">' + flags.map(f => '<article class="flag"><h3><span class="chip ' + f.sev + '">' + ({ bad: 'Fix', warn: 'Watch', good: 'Good' })[f.sev] + '</span>' + esc(f.title) + '</h3><p>' + esc(f.problem) + '</p><p class="fix"><b>Do this:</b> ' + esc(f.fix) + '</p>' + fixRow(f, st) + '</article>').join('') + '</div>'
      : '<p class="small muted">Not enough logged yet this week to judge.</p>';
  }
  if (!IN_CLAUDE) h += '<div class="row"><button class="btn sm" data-act="copy"' + (rv.empty ? ' disabled' : '') + '>Copy week summary</button></div><p class="xs muted">Paste it into Claude for next week\u2019s changes.</p>' + (S.coach.text ? '<div class="coach-out">' + esc(S.coach.text) + '</div>' : '') + '</section>';
  else h += '<div class="row"><button class="btn primary sm" data-act="coach"' + (S.coach.busy || rv.empty ? ' disabled' : '') + '>' + (S.coach.busy ? 'Thinking…' : 'Ask Claude for next week’s changes') + '</button><button class="btn sm ghost" data-act="copy"' + (rv.empty ? ' disabled' : '') + '>Copy summary</button></div>' +
    (S.coach.text || S.coach.err ? '<div class="coach-out" aria-live="polite">' + (S.coach.err ? esc(S.coach.err) : mdLite(S.coach.text)) + '</div>' : '') + '</section>';

  const series = weightSeries(st.weights);
  const G = GOALS[st.profile.goal || 'leanbulk'];
  const last = series[series.length - 1];
  h += '<section class="card"><div class="card-h">' + ttl('Body weight', 'trend') + '' + (wt ? '<span class="chip ' + (wt.perWeek >= wt.latest * G.lo - 0.05 && wt.perWeek <= wt.latest * G.hi + 0.05 ? 'good' : 'warn') + ' num">' + sign(r1n(toU(wt.perWeek))) + ' ' + UNIT + ' a week</span>' : '') + '</div>' +
    '<div class="inline-field"><div class="field"><label for="pw-w">Today’s weight (' + UNIT + ')</label><input id="pw-w" inputmode="decimal" placeholder="' + (last ? fmtBW(last.lb) : UNIT === 'kg' ? 'e.g. 90.2' : 'e.g. 198.4') + '"></div><button class="btn primary" data-act="saveweight" data-src="pw-w">Log</button></div>';
  if (series.length >= 2) h += weightChart(series.map(x => Object.assign({}, x, { lb: toU(x.lb) }))) + '<p class="xs muted">' + (wt ? 'Goal (' + G.n.toLowerCase() + '): ' + sign(r1n(toU(wt.latest * G.lo))) + ' to ' + sign(r1n(toU(wt.latest * G.hi))) + ' ' + UNIT + ' a week.' : 'Weigh in a few times a week to see your trend.') + ' Weigh in each morning before eating.</p>';
  else if (last) h += '<p class="small muted">Latest: ' + fmtBW(last.lb) + ' ' + UNIT + '. Log a few more weigh-ins to see your trend.</p>';
  h += '</section>';

  let ms = Object.keys(MUSCLES).filter(m => plan[m] > 0.5).sort((a, b) => (pri.includes(b) - pri.includes(a)) || plan[b] - plan[a]);
  if (!S.showAllSets) ms = ms.filter(m => pri.includes(m)).concat(ms.filter(m => !pri.includes(m)).slice(0, 3));
  const mx = Math.max(1, ...ms.map(m => Math.max(plan[m], vol[m])));
  h += '<section class="card"><div class="card-h">' + ttl('Sets this week', 'sets') + '<span class="muted xs">Bar = done · line = goal</span></div><div class="vbars">' + ms.map(m => {
    const okv = vol[m] >= plan[m] * 0.8;
    return '<div class="vbar"><span class="name">' + MUSCLES[m].n + (pri.includes(m) ? ' <span class="tag pri sm">F</span>' : '') + '</span><span class="track"><span class="fill" style="width:' + (vol[m] / mx * 100) + '%;background:' + (okv ? 'var(--green)' : pri.includes(m) ? 'var(--red)' : 'var(--blue)') + '"></span><span class="plan" style="left:' + (plan[m] / mx * 100) + '%"></span></span><span class="v num">' + r1n(vol[m]) + '/' + r1n(plan[m]) + '</span></div>';
  }).join('') + '</div><button class="linkbtn" data-act="allsets">' + (S.showAllSets ? 'Show fewer' : 'Show all muscles') + '</button></section>';

  const hist = liftHistory(st);
  const ids = Object.keys(hist).filter(id => hist[id].some(x => x.v > 0)).sort((a, b) => hist[b][hist[b].length - 1].at - hist[a][hist[a].length - 1].at).slice(0, 10);
  h += '<section class="card"><div class="card-h">' + ttl('Strength', 'e1rm') + '<span class="muted xs">Estimated 1-rep max</span></div>';
  h += ids.length ? '<div>' + ids.map(id => {
    const vs = hist[id].map(x => x.v).filter(v => v > 0).map(v => Math.round(toU(v)));
    const ch = vs[vs.length - 1] - vs[0];
    const isPr = vs.length > 1 && vs[vs.length - 1] > Math.max(...vs.slice(0, -1)) && now - hist[id][hist[id].length - 1].at < 7 * 864e5;
    return '<div class="lift"><span>' + esc(EX[id].n) + (isPr ? ' <span class="pr sm">PR</span>' : '') + '</span><span class="v num">' + vs[vs.length - 1] + '<small class="' + (ch > 0 ? 'up' : ch < 0 ? 'down' : 'muted') + '">' + (vs.length > 1 ? (ch === 0 ? 'no change' : (ch > 0 ? '+' : '') + ch + ' ' + UNIT) : 'first time') + '</small></span>' + spark(vs) + '</div>';
  }).join('') + '</div>' : '<p class="small muted">Finish a workout and your lifts show up here.</p>';
  h += '</section>';

  const ss = st.sessions.slice().reverse().slice(0, 15);
  if (ss.length) {
    h += '<details class="card" data-dk="hist"' + (S.det.hist ? ' open' : '') + '><summary><h2>Past workouts</h2>' + CHEV + '</summary><div class="hist">' + ss.map(s => {
      const dn = (SPLITS[s.split || 5] || SPLITS[5])[s.day];
      const nts = Object.keys(s.exNotes || {}).filter(id => EX[id]).map(id => '<li><b>' + esc(EX[id].n) + ':</b> ' + esc(noteBits(s.exNotes[id])) + '</li>').join('');
      return '<div class="hrow"><span><b>' + fmtDate(s.at) + '</b> · ' + esc(dn ? dn.name : 'Workout') + '<br><span class="xs muted num">Week ' + s.week + (s.deload ? ' (extra deload)' : '') + ' · ' + s.sets.length + (s.sets.length === 1 ? ' set' : ' sets') + (s.minutes ? ' · ' + s.minutes + ' min' : '') + '</span>' +
        (s.note ? '<span class="hnote">\u201c' + esc(s.note) + '\u201d</span>' : '') + (nts ? '<ul class="hnotes">' + nts + '</ul>' : '') + '</span>' +
        (S.demo ? '' : '<button class="btn sm ghost danger" data-act="delsession" data-id="' + esc(s.id) + '">' + (S.armed === 'del:' + s.id ? 'Confirm' : 'Delete') + '</button>') + '</div>';
    }).join('') + '</div></details>';
  }
  return h;
}

/* ================= SETTINGS ================= */
function vSettings(st) {
  const P = st.profile;
  const ptr = pointer(st);
  const cw = Math.min(ptr.week, 8);
  const days = daysFor(P);
  const T = nutritionTargets(P, latestWeight(st));
  let h = band({ eyebrow: 'Settings', title: possessive(P, 'plan'), plate: 'PLAN', sub: GOALS[P.goal || 'leanbulk'].n + ' · ' + days.length + ' days a week' });
  if (!S.demo) h += profilesCard();
  h += '<section class="card"><div class="lbl-row"><span class="unit-l">Training in</span>' + regionSeg('region', P.region) + '</div>' +
    '<div class="lbl-row"><span class="unit-l">Weights in</span>' + unitSeg('unit') + '</div>' +
    '<div class="inline-field"><div class="field"><label for="setname">Your first name</label><input id="setname" autocomplete="given-name" value="' + esc(P.name || '') + '" placeholder="e.g. Mo"></div><button class="btn" data-act="savename">Save</button></div></section>';
  h += '<section class="card"><div class="summary">' +
    '<div><span>Goal</span><b>' + GOALS[P.goal || 'leanbulk'].n + '</b></div>' +
    '<div><span>Training</span><b>' + days.length + ' days a week</b><small>' + days.map(d => d.name).join(' · ') + '</small></div>' +
    '<div><span>Focus</span><b>' + prioOf(P).map(m => MUSCLES[m].n).join(', ') + '</b></div>' +
    (ageNote(P) ? '<div><span>Age ' + esc(P.age) + '</span><small>' + esc(ageNote(P).replace(/^Adjusted for age \d+: /, 'Plan adjusted: ')) + '</small></div>' : '') +
    (T ? '<div><span>Food</span><b>' + n0(T.kcal) + ' cal · ' + T.protein + ' g protein</b><small>' + (P.meals || 4) + ' meals a day' + (T.adj ? ' · includes ' + (T.adj > 0 ? '+' : '\u2212') + Math.abs(T.adj) + ' cal from your weekly fixes <button class="linkbtn" data-act="kcalreset">Reset</button>' : '') + '</small></div>' : '') +
    '</div><button class="btn primary" data-act="setup">Change my answers</button></section>';

  h += '<section class="card"><div class="card-h"><h2>8-week map</h2></div><div class="phases">' + WEEKS.map(w => '<div class="ph' + (w.phase === 'Deload' ? ' deload' : '') + (w.w === cw ? ' cur' : '') + (w.w < ptr.week ? ' done' : '') + '"><b>' + w.w + '</b><span>' + (w.phase === 'Deload' ? 'Easy' : w.phase) + '</span></div>').join('') + '</div>' +
    '<p class="small"><b>Week ' + cw + ':</b> ' + esc(WEEKS[cw - 1].note.replace('1 rep in reserve', '1 rep left in the tank')) + '</p></section>';

  h += '<section class="card"><div class="card-h"><h2>This week’s workouts</h2></div>';
  days.forEach((d, i) => {

/* ---------- rest timer: starts on its own when a set is checked ---------- */
let restT = null, wakeL = null, audioC = null;
const mmss = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
const REST_C = 2 * Math.PI * 15;
function startRest(secs, key, i, plan) {
  const t0 = Date.now();
  S.rest = { t0, base: secs, extra: 0, adj: 0, plan: plan == null ? 2 : plan, end: t0 + secs * 1000, total: secs, key, i, up: false, msg: '' };
  try { const AC = window.AudioContext || window.webkitAudioContext; if (!audioC && AC) audioC = new AC(); if (audioC && audioC.state === 'suspended') audioC.resume(); } catch (e) { audioC = null; }
  keepAwake();

}
function keepAwake() {

}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.rest && !S.rest.up) keepAwake(); });

}
function beep() {
  try {
    const c = audioC; if (!c) return; const t0 = c.currentTime;
    [[0, 784], [0.22, 1046]].forEach(([t, f]) => {
      const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + t); g.gain.exponentialRampToValueAtTime(0.12, t0 + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + 0.18);
      o.connect(g); g.connect(c.destination); o.start(t0 + t); o.stop(t0 + t + 0.2);
    });
  } catch (e) { }
}
/* only the timer's own text and ring update each tick; the page never re-renders for it */
function tickRest() {
  const r = S.rest; if (!r) { clearInterval(restT); restT = null; return; }
  const left = Math.ceil((r.end - Date.now()) / 1000);
  if (!r.up && left <= 0) { r.up = true; r.upAt = Date.now(); try { if (navigator.vibrate) navigator.vibrate([180, 80, 180]); } catch (e) { } beep(); renderRest(); return; }
  if (r.up) { if (Date.now() - r.upAt > 12000) stopRest(); return; }

  const g = $('#rest-ring'); if (g) g.style.strokeDashoffset = (REST_C * (1 - left / r.total)).toFixed(1);
}
function restRetime() {

}
function restLog() { const r = S.rest, d = curDraft(); return r && d && d.logs && d.logs[r.key] ? d.logs[r.key][r.i] : null; }
function renderRest() {
  const el = $('#rest'), r = S.rest;

  if (!r) { if (el) el.remove(); return; }
  const l = restLog();
  const cur = l && l.rir !== '' && l.rir != null ? Math.min(3, Math.round(+l.rir)) : null;
  const left = Math.max(0, Math.ceil((r.end - Date.now()) / 1000));
  const html = '<div id="rest" class="rest' + (r.up ? ' up' : '') + '" role="region" aria-label="Rest timer"><div class="rest-top">' +
    '<svg class="rest-ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" class="tr"/><circle id="rest-ring" cx="18" cy="18" r="15" class="fg" style="stroke-dasharray:' + REST_C.toFixed(1) + ';stroke-dashoffset:' + (r.up ? REST_C : REST_C * (1 - left / r.total)).toFixed(1) + '"/></svg>' +
    '<span class="rest-t">' + (r.up ? '<b>Rest’s up</b><small>Next set when you’re ready</small>' : '<b class="num" id="rest-n">' + mmss(left) + '</b><small>Rest</small>') + '</span>' +

/* ---- live camera scanning (standalone website only; the Claude app blocks the camera) ---- */
let cam = { stream: null, timer: null, busy: false, det: null, zx: null };
function camStop() { clearInterval(cam.timer); cam.timer = null; if (cam.stream) cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; }
async function camStart() {
  openFoodSheet('camera');
  const hint = m => { const h = $('#cam-hint'); if (h) h.textContent = m; };
  try {
    if ('BarcodeDetector' in window) { try { cam.det = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] }); } catch (e) { cam.det = null; } }
    const zxP = cam.det ? null : loadZXing().catch(() => null);
    cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $('#cam-v'); if (!v || !S.fsheet || S.fsheet.mode !== 'camera') { camStop(); return; }
    v.srcObject = cam.stream; await v.play();
    const Z = zxP ? await zxP : null;
    if (!cam.det && !Z) { camStop(); openFoodSheet('barcode'); toast('The barcode reader couldn\u2019t load. Type the number instead.'); return; }
    if (Z && !cam.zx) { const hints = new Map(); hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128]); hints.set(Z.DecodeHintType.TRY_HARDER, true); cam.zx = new Z.MultiFormatReader(); cam.zx.setHints(hints); }
    hint('Point at the barcode');
    const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
    cam.timer = setInterval(async () => {
      if (cam.busy || !v.videoWidth) return; cam.busy = true;
      const w = v.videoWidth, h = v.videoHeight, cw = Math.round(w * 0.8), ch = Math.round(h * 0.45);
      c.width = cw; c.height = ch; ctx.drawImage(v, (w - cw) / 2, (h - ch) / 2, cw, ch, 0, 0, cw, ch);
      let code = null;
      if (cam.det) { try { const r = await cam.det.detect(c); if (r && r[0]) code = r[0].rawValue; } catch (e) { } }
      else if (cam.zx && window.ZXing) { try { const Zx = window.ZXing; code = cam.zx.decode(new Zx.BinaryBitmap(new Zx.HybridBinarizer(new Zx.HTMLCanvasElementLuminanceSource(c)))).getText(); } catch (e) { } }
      cam.busy = false;
      if (code && cam.timer) { camStop(); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) { } lookupBarcode(code); }
    }, 220);
  } catch (e) {
    camStop();
    if (!S.fsheet) return;
    openFoodSheet('barcode'); toast(e && e.name === 'NotAllowedError' ? 'Camera access is off. Allow it in your browser settings, or type the number.' : 'The camera didn\u2019t start. Type the number instead.');
  }
}
async function handleBarcodeFile(file) {
  openFoodSheet('busy', { msg: 'Reading the barcode…' });
  let code = null, failMsg = '';
  try { code = await decodeBarcode(file); } catch (e) { failMsg = e && e.message === 'load' ? 'The barcode reader couldn’t load. Check your connection, or type the numbers instead.' : ''; }
  if (!S.fsheet) return;
  if (!code) { openFoodSheet('scanfail', { msg: failMsg || 'Couldn’t read that barcode. Hold the phone closer so the barcode fills the photo, with no glare.' }); return; }
  lookupBarcode(code);
}

/* ---- Claude: read a label photo, or estimate a typed food ---- */
async function getSample() { try { return window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { return null; } }
async function ensureImageSupport() {
  if (S.canImages != null) return S.canImages;
  const sample = await getSample();
  let caps = null; if (sample) try { caps = await sample.limits(); } catch (e) { }
  S.canImages = !!(caps && caps.images);
  return S.canImages;
}
function sampleErr(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled') return 'Claude access wasn’t allowed for this page, so enter the numbers yourself.';
  if (c === 'rate_limited') return 'Too many requests. Try again in a minute.';
  if (c === 'image_rejected') return 'That photo couldn’t be read. Try a sharper photo of the label.';
  return 'Claude couldn’t answer just now. Try again, or enter the numbers yourself.';
}
let fsCtl = null;
async function readLabel(file) {
  const form = S.fsheet && S.fsheet.form || {};
  const sample = await getSample();
  if (!sample) { S.fsheet.msg = 'Claude isn’t reachable from this view. Enter the label numbers yourself.'; renderFoodSheet(); return; }
  openFoodSheet('busy', { msg: 'Claude is reading the label…', form, back: 'form' });
  fsCtl = new AbortController();
  try {
    const r = await sample.json('The photo shows a food package. Read its Nutrition Facts label. Reply with only a JSON object for ONE serving: {"name": product name if visible else "", "serving": serving size as printed (e.g. "1 bar (60 g)"), "kcal": number, "protein": grams, "carbs": total carbohydrate grams, "fat": total fat grams}. If no nutrition label is visible, reply {"error": "no label"}.', { images: [file], signal: fsCtl.signal });
    if (!S.fsheet) return;
    if (!r || r.error) { openFoodSheet('form', { form, msg: 'No nutrition label found in that photo. Try again with the label filling the frame.' }); return; }
    const n = cleanNutrition(r);
    openFoodSheet('form', { form: Object.assign({}, form, { name: form.name || n.name, serving: n.serving || form.serving, kcal: n.kcal, p: n.p, c: n.c, f: n.f }), msg: 'Check the numbers against the label, then save.' });
  } catch (e) {
    if (!S.fsheet || (e && e.code === 'cancelled')) return;
    openFoodSheet('form', { form, msg: sampleErr(e) });
  }
}
async function readMeal(file) {
  const sample = await getSample();
  if (!sample) { toast('Claude isn\u2019t reachable from this view. Search or type what you ate instead.'); return; }
  openFoodSheet('busy', { msg: 'Claude is looking at your meal\u2026', back: 'search' });
  fsCtl = new AbortController();
  try {
    const r = await sample.json('The photo shows a meal or snack someone is about to eat. Identify each food and estimate its portion from visual cues such as plate size, utensils and hands. Use USDA-style nutrition values.' + (regionOf(data().profile) === 'eg' ? ' The person is in Egypt: recognize Egyptian dishes (koshari, ful, ta\u2019ameya, molokhia, hawawshi, mahshi) and typical Egyptian portions.' : '') + ' Reply with only JSON: {"name": short name for the whole meal (e.g. "Chicken, rice and broccoli"), "items": [{"name": string, "portion": string like "6 oz" or "1 cup"}], "kcal": total number, "protein": total grams, "carbs": total grams, "fat": total grams}. If no food is visible, reply {"error": "no food"}.', { images: [file], signal: fsCtl.signal });
    if (!S.fsheet) return;
    const n = cleanNutrition(r || {});
    if (!r || r.error || n.kcal == null || n.kcal > 4000) { openFoodSheet('search', {}); toast('No food found in that photo. Try again with the plate filling the frame.'); return; }
    const parts = Array.isArray(r.items) ? r.items.slice(0, 6).map(x => String(x.name || '').trim() + (x.portion ? ' (' + String(x.portion).trim() + ')' : '')).filter(Boolean) : [];
    openFoodSheet('qty', { sel: { name: n.name || 'Meal', serving: parts.length ? parts.join(', ').slice(0, 120) : '1 plate', kcal: n.kcal, p: n.p || 0, c: n.c || 0, f: n.f || 0, src: 'estimate' }, save: false });
  } catch (e) {
    if (!S.fsheet || (e && e.code === 'cancelled')) return;
    openFoodSheet('search', {}); toast(sampleErr(e).replace('label', 'meal'));
  }
}
async function fillFromName(name) {
  const form = S.fsheet && S.fsheet.form || {};
  const sample = await getSample();
  if (!sample) { S.fsheet.msg = 'Claude isn\u2019t reachable from this view. Enter the label numbers yourself.'; renderFoodSheet(); return; }
  openFoodSheet('busy', { msg: 'Claude is looking up \u201c' + name + '\u201d\u2026', form, back: 'form' });
  fsCtl = new AbortController();
  try {
    const r = await sample.json('Give the Nutrition Facts for ONE serving of this packaged food product, as printed on its US label: "' + name.replace(/"/g, "'") + '". Use the brand\u2019s published label values if you know them; otherwise estimate from similar products. Reply with only JSON: {"name": product name, "serving": serving size as on the label, "kcal": number, "protein": grams, "carbs": grams, "fat": grams, "known": true if you know this exact product\u2019s label, false if estimated}.', { signal: fsCtl.signal });
    if (!S.fsheet) return;
    const n = cleanNutrition(r || {});
    if (n.kcal == null) { openFoodSheet('form', { form, msg: 'Claude couldn\u2019t find that one. Enter the label numbers yourself.' }); return; }
    openFoodSheet('form', { form: Object.assign({}, form, { name: n.name || name, serving: n.serving || form.serving, kcal: n.kcal, p: n.p, c: n.c, f: n.f }),
      msg: r && r.known ? 'Filled in from the brand\u2019s label. Check it against the package, then save.' : 'Claude didn\u2019t know this exact product, so these are estimates. Check them against the label.' });
  } catch (e) {
    if (!S.fsheet || (e && e.code === 'cancelled')) return;
    openFoodSheet('form', { form, msg: sampleErr(e) });
  }
}
async function estimateFood(text) {
  const sample = await getSample();
  const q = text;
  if (!sample) { S.fsheet.msg = ''; openFoodSheet('form', { form: { name: q }, msg: 'Claude isn’t reachable from this view. Enter the numbers yourself.' }); return; }
  openFoodSheet('busy', { msg: 'Claude is estimating “' + q + '”…', q, back: 'search' });
  fsCtl = new AbortController();
  try {
    const r = await sample.json('Estimate the nutrition of this food as typically eaten: "' + q.replace(/"/g, "'") + '". If a quantity is given, use it; otherwise assume one typical US portion. Use USDA-style values; for restaurant items use the chain’s published numbers if you know them.' + (regionOf(data().profile) === 'eg' ? ' The person is in Egypt: recognize Egyptian dishes and typical Egyptian portions.' : '') + ' Reply with only JSON: {"name": short descriptive name, "serving": the portion you assumed (e.g. "1 bowl (450 g)"), "kcal": number, "protein": grams, "carbs": grams, "fat": grams}.', { signal: fsCtl.signal });
    if (!S.fsheet) return;
    const n = cleanNutrition(r || {});
    if (n.kcal == null || n.kcal > 6000) { openFoodSheet('search', { q, msg: '' }); toast('Claude couldn’t estimate that one. Try describing it differently.'); return; }
    openFoodSheet('qty', { sel: { name: n.name || q, serving: n.serving || '1 serving', kcal: n.kcal, p: n.p || 0, c: n.c || 0, f: n.f || 0, src: 'estimate' }, q });
  } catch (e) {
    if (!S.fsheet || (e && e.code === 'cancelled')) return;
    openFoodSheet('search', { q }); toast(sampleErr(e));
  }
}

/* ---- events ---- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (!act.startsWith('fs-') && act !== 'logdel' && act !== 'erase' && act !== 'demo-settings') return;
  const fs = S.fsheet;
  switch (act) {
    case 'fs-scrim': if (e.target === t) closeFoodSheet(); break;
    case 'fs-close': closeFoodSheet(); break;
    case 'fs-open': ensureImageSupport(); openFoodSheet('search'); setTimeout(() => { const i = $('#fs-q'); if (i) i.focus(); }, 30); break;
    case 'fs-cam': camStart(); break;
    case 'fs-camstop': camStop(); closeFoodSheet(); break;
    case 'fs-camtype': camStop(); openFoodSheet('barcode'); setTimeout(() => { const i = $('#fs-bc'); if (i) i.focus(); }, 30); break;
    case 'fs-scan': if (CAN_CAM && !t.closest('.sheet-b')) { camStart(); break; } openFoodSheet('barcode'); setTimeout(() => { const i = $('#fs-bc'); if (i) i.focus(); }, 30); break;
    case 'fs-labelprep': readForm(); { const inp = $('#lbl-file'); if (inp) inp.value = ''; } break;
    case 'fs-fromname': {
      const f = readForm();
      if (!f.name || f.name.length < 3) { S.fsheet.msg = 'Type the product name first, with the brand (e.g. Quest bar cookies & cream).'; renderFoodSheet(); return; }
      fillFromName(f.name); break;
    }
    case 'fs-custom': ensureImageSupport().then(() => openFoodSheet('form', { form: { name: fs && fs.q ? fs.q : '' } })); break;
    case 'fs-pick': { const f = fs && fs.results[t.dataset.k]; if (f) openFoodSheet('qty', { sel: f, q: fs.q, save: f.src === 'db' ? false : true }); break; }
    case 'fs-estimate': if (fs) estimateFood(fs.q.trim()); break;
    case 'fs-qty': { fs.qty = Math.max(0.5, r1n((+fs.qty || 0) + parseFloat(t.dataset.d))); const i = $('#fs-qty-in'); if (i) i.value = fs.qty; const tt = $('#fs-total'); if (tt) tt.innerHTML = fsTotalHTML(); break; }
    case 'fs-add': {
      const q = +fs.qty; if (!(q > 0)) { toast('Enter how many servings'); return; }
      const chk = $('#fs-save'); const f = fs.sel;
      if (chk && chk.checked) saveMyFood(f);
      addLogItem(f, q); closeFoodSheet(); toast('Added ' + n0(f.kcal * q) + ' cal');
      break;
    }
    case 'fs-back': openFoodSheet(fs && fs.back === 'form' ? 'form' : 'search', { q: fs ? fs.q || '' : '', form: fs && fs.form }); break;
    case 'fs-cancel': if (fsCtl) fsCtl.abort(); openFoodSheet(fs && fs.back === 'form' ? 'form' : 'search', { q: fs ? fs.q || '' : '', form: fs && fs.form }); break;

    case 'fs-saveform': {
      const f = cleanNutrition(readForm());
      if (!f.name) { fs.msg = 'Give it a name.'; renderFoodSheet(); return; }
      if (f.kcal == null) { fs.msg = 'Enter the calories per serving.'; renderFoodSheet(); return; }
      const doc = saveMyFood(Object.assign({}, f, { p: f.p || 0, c: f.c || 0, f: f.f || 0, serving: f.serving || '1 serving', barcode: fs.form && fs.form.barcode }));
      openFoodSheet('qty', { sel: Object.assign({ src: 'mine' }, doc) });
      break;
    }
    case 'fs-bclookup': { const v = $('#fs-bc') && $('#fs-bc').value; if (normCode(v).length < 6) { toast('Type all the numbers under the barcode'); return; } lookupBarcode(v); break; }
    case 'logdel': {
      const st = data(); const fd = todayFood(st); const id = t.dataset.id;
      setFood(todayKey(), { items: (fd.items || []).filter(x => x.id !== id) }); toast('Removed'); break;
    }
    case 'demo-settings': enterDemo(); break;
    case 'erase': if (armed('erase')) eraseEverything(); break;
  }
});
function parseFoodCode(text) {
  const i = String(text || '').indexOf('IRONLEDGER:');
  if (i < 0) return null;
  try {
    const o = JSON.parse(String(text).slice(i + 11).trim());
    const n = cleanNutrition({ name: o.n, serving: o.s, kcal: o.k, p: o.p, c: o.c, f: o.f });
    if (!n.name || n.kcal == null) return null;
    return Object.assign(n, { p: n.p || 0, c: n.c || 0, f: n.f || 0, serving: n.serving || '1 serving', barcode: o.b ? normCode(o.b) : null });
  } catch (e) { return null; }
}
function takeFoodCode(text) {
  const f = parseFoodCode(text);
  if (!f) return false;
  const mine = f.barcode && (data().myfoods || []).find(x => x.barcode && normCode(x.barcode) === f.barcode);
  const doc = saveMyFood(Object.assign({}, f, mine ? { id: mine.id } : {}));
  openFoodSheet('qty', { sel: Object.assign({ src: 'mine' }, doc) });
  toast('Got it: ' + doc.name);
  return true;
}
document.addEventListener('input', e => {
  if ((e.target.id === 'fs-bc' || e.target.id === 'fs-q') && S.fsheet && takeFoodCode(e.target.value)) return;
  if (e.target.id === 'fs-bc' && S.fsheet && e.inputType === 'insertFromPaste') { const c = normCode(e.target.value); if (c.length >= 8 && c.length <= 14) { lookupBarcode(c); return; } }
  if (e.target.id === 'fs-q' && S.fsheet) { S.fsheet.q = e.target.value; const l = $('#fs-list'); if (l) l.innerHTML = fsResultsHTML(); }
  if (e.target.id === 'fs-qty-in' && S.fsheet) { S.fsheet.qty = parseFloat(e.target.value) || 0; const tt = $('#fs-total'); if (tt) tt.innerHTML = fsTotalHTML(); }
  if (e.target.id === 'fs-save' && S.fsheet) S.fsheet.save = e.target.checked;
});
document.addEventListener('change', e => {
  if (e.target.id === 'fs-save' && S.fsheet) S.fsheet.save = e.target.checked;
  if ((e.target.id === 'bc-file' || e.target.id === 'bc-file2') && e.target.files && e.target.files[0]) { const fl = e.target.files[0]; e.target.value = ''; handleBarcodeFile(fl); }
  if (e.target.id === 'lbl-file' && e.target.files && e.target.files[0]) readLabel(e.target.files[0]);
  if (e.target.id === 'meal-file' && e.target.files && e.target.files[0]) { const fl = e.target.files[0]; e.target.value = ''; readMeal(fl); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.fsheet) closeFoodSheet();
  if (e.key === 'Enter' && e.target.id === 'fs-bc' && S.fsheet) { const b = $('[data-act=fs-bclookup]'); if (b) b.click(); }
  if (e.key === 'Enter' && e.target.id === 'fs-q' && S.fsheet) { const first = $('#fs-list [data-act=fs-pick], #fs-list [data-act=fs-estimate]'); if (first) first.click(); }
});

/* ---- erase everything (back to the setup questions) ---- */
async function eraseEverything() {
  if (S.demo) { exitDemo(); toast('Sample closed. Your own data wasn\u2019t touched.'); return; }
  const groups = { sessions: S.sessions, weights: S.weights, checkins: S.checkins, food: S.food, myfoods: S.myfoods };
  if (S.mode === 'db') {
    const jobs = [];
    Object.keys(groups).forEach(g => Object.keys(groups[g]).forEach(id => jobs.push(delDoc(g + '/' + id))));
    jobs.push(delDoc('profile/main'));
    await Promise.all(jobs);
  }
  S.sessions = {}; S.weights = {}; S.checkins = {}; S.food = {}; S.myfoods = {};
  S.profile = clone(DEFAULT_PROFILE);
  lsDel(LS_KEY + sfx()); lsDel(LS_TAB); setDraft(null);
  S.selDay = null; S.open = null; S.selMuscle = null; S.coach = { text: '', busy: false, err: '' }; S.tab = 'workout';
  saveLocal(); render(); window.scrollTo(0, 0);
  toast('Everything erased. Starting fresh.');
}

/* ---------- shell ---------- */
document.getElementById('tabs').innerHTML = '<div class="tabs-in">' + TABS.map(t => '<button class="tab" data-act="tab" data-tab="' + t.id + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[t.id] + '</svg>' + t.n + '</button>').join('') + '</div>';
boot();
