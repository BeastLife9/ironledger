<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: one narrow phone column. Each tab owns one competition-plate colour
   (Workout red, Food green, Body blue, Progress yellow) that paints its banner, buttons and highlights. */
:root {
  --bg: #ECEFF5;
  --surface: #FFFFFF;
  --surface-2: #F3F5F9;
  --ink: #0D1424;
  --muted: #586378;
  --line: #DAE0EA;

  --red: #D62839;     --red-fg: #C21F30;     --red-soft: #FCE3E6;
  --blue: #2457D6;    --blue-fg: #2457D6;    --blue-soft: #E0E8FB;
  --yellow: #F4B400;  --yellow-fg: #8A6500;  --yellow-soft: #FDF0C7;
  --green: #0B8A43;   --green-fg: #087A3A;   --green-soft: #D6F2E2;

  --good: var(--green-fg); --good-soft: var(--green-soft);
  --warn: var(--yellow-fg); --warn-soft: var(--yellow-soft);
  --bad: var(--red-fg); --bad-soft: var(--red-soft);

  --tab: var(--red); --tab-fg: var(--red-fg); --tab-soft: var(--red-soft); --tab-ink: #FFFFFF;
  --band-ink: #FFFFFF; --band-dim: #FFFFFF; --band-line: rgba(255, 255, 255, .22); --band-chip: rgba(0, 0, 0, .2);

  --body: #D9DFE9;
  --muscle: #B8C2D2;
  --mini: #C3CCDA;
  --rest-go: #3DDB86;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
  --font-body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 14px;
  --shadow: 0 1px 2px rgba(13, 20, 36, .06), 0 4px 14px rgba(13, 20, 36, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080C17; --surface: #121A2C; --surface-2: #19223A; --ink: #EEF2F9; --muted: #9AA6BE; --line: #243050;
    --red: #D62839; --red-fg: #FF6B76; --red-soft: #3B1520;
    --blue: #2F63E6; --blue-fg: #7CA2FF; --blue-soft: #172549;
    --yellow: #F4B400; --yellow-fg: #FFCB45; --yellow-soft: #352A0B;
    --green: #0E9A4C; --green-fg: #3DDB86; --green-soft: #0F2E1E;
    --body: #1E2840; --muscle: #34405C; --mini: #43527A;
    --shadow: none; --rest-go: #0B8A43;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080C17; --surface: #121A2C; --surface-2: #19223A; --ink: #EEF2F9; --muted: #9AA6BE; --line: #243050;
  --red: #D62839; --red-fg: #FF6B76; --red-soft: #3B1520;
  --blue: #2F63E6; --blue-fg: #7CA2FF; --blue-soft: #172549;
  --yellow: #F4B400; --yellow-fg: #FFCB45; --yellow-soft: #352A0B;
  --green: #0E9A4C; --green-fg: #3DDB86; --green-soft: #0F2E1E;
  --body: #1E2840; --muscle: #34405C; --mini: #43527A;
  --shadow: none; --rest-go: #0B8A43;
  color-scheme: dark;
}
body.t-workout, body.t-setup { --tab: var(--red); --tab-fg: var(--red-fg); --tab-soft: var(--red-soft); --tab-ink: #FFFFFF; }
body.t-food { --tab: #087A3A; --tab-fg: var(--green-fg); --tab-soft: var(--green-soft); --tab-ink: #FFFFFF; }
body.t-body { --tab: var(--blue); --tab-fg: var(--blue-fg); --tab-soft: var(--blue-soft); --tab-ink: #FFFFFF; }
body.t-progress { --tab: var(--yellow); --tab-fg: var(--yellow-fg); --tab-soft: var(--yellow-soft); --tab-ink: #1A1400;
  --band-ink: #1A1400; --band-dim: #1A1400; --band-line: rgba(26, 20, 0, .16); --band-chip: rgba(26, 20, 0, .12); }
body.t-settings { --tab: #1B2540; --tab-fg: var(--blue-fg); --tab-soft: var(--blue-soft); --tab-ink: #FFFFFF; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--tab-fg); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num, input.in, .tnum { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 560px; margin: 0 auto; padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 23px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; white-space: nowrap; min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: 0 0 auto; }
.brand-mark .o { fill: var(--tab); transition: fill .3s; } .brand-mark .i { fill: var(--surface); } .brand-mark .h { fill: var(--tab); }
.brand span { color: var(--tab-fg); transition: color .3s; }
.wk { display: flex; align-items: center; gap: 10px; min-width: 0; }
.wk-t { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.wk-t b { font-family: var(--font-display); font-size: 17px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.wk-t small { font-size: 12px; color: var(--muted); white-space: nowrap; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: 1px; }
.dot.ok { background: var(--green-fg); } .dot.demo { background: var(--yellow); }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.iconbtn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn[aria-current="page"] { color: var(--tab-ink); background: var(--tab); border-color: var(--tab); }

/* ---------- main column ---------- */
main {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(100px + env(safe-area-inset-bottom, 0px));
}
.col { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-h h2, details.card > summary h2 { font-family: var(--font-display); font-weight: 800; font-size: 21px; text-transform: uppercase; letter-spacing: .03em; line-height: 1.1; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; } .xs { font-size: 12.5px; }
.center { text-align: center; align-self: center; }

/* ---------- colour banner ---------- */
.band {
  position: relative; overflow: hidden; border-radius: 20px; background: var(--tab); color: var(--band-ink);
  padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px; isolation: isolate;
}
.band .plate { position: absolute; right: -64px; top: -58px; width: 230px; height: 230px; z-index: -1; pointer-events: none; }
.plate .p1 { fill: var(--band-line); opacity: .45; }
.plate .p2, .plate .p3 { fill: none; stroke: var(--band-line); stroke-width: 2; }
.plate .p4 { fill: var(--tab); stroke: var(--band-line); stroke-width: 2; }
.plate text { fill: var(--band-ink); opacity: .18; font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: .06em; }
.band-in { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.band-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.band .eyebrow { color: var(--band-dim); }
.band h1 { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: .92; text-transform: uppercase; letter-spacing: .01em; }
.band p { color: var(--band-dim); font-size: 15px; }
.band p b { color: var(--band-ink); }
.band-side { flex: 0 0 auto; display: flex; align-items: center; }
.bchips { display: flex; flex-wrap: wrap; gap: 6px; }
.bchip { background: var(--band-chip); color: var(--band-ink); border-radius: 999px; padding: 4px 11px; font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.weekdots { display: flex; gap: 6px; }
.wd { flex: 1 1 0; min-width: 0; border-radius: 10px; padding: 6px 4px; text-align: center; background: var(--band-chip); font-size: 12px; font-weight: 700; color: var(--band-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wd.done { background: var(--band-ink); color: var(--tab); }
.wd.cur { box-shadow: inset 0 0 0 2px var(--band-ink); color: var(--band-ink); }
.bodymap.onband { width: 118px; max-width: 118px; }
.bodymap.onband .sil { fill: var(--band-line); }
.bodymap.onband .mus { stroke: none; cursor: default; }
.bodymap.onband text { display: none; }

/* rings */
.ringwrap { position: relative; flex: 0 0 auto; }
.ringwrap svg { display: block; }
.rings .rt { fill: none; }
.rings .rp { fill: none; stroke-linecap: round; transition: stroke-dasharray .5s ease; }
.ringc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1; }
.ringc b { font-family: var(--font-display); font-weight: 800; font-size: 26px; }
.ringc small { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .8; margin-top: 3px; }

/* chips, tags */
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--green-soft); color: var(--green-fg); border-color: transparent; }
.chip.warn { background: var(--yellow-soft); color: var(--yellow-fg); border-color: transparent; }
.chip.bad { background: var(--red-soft); color: var(--red-fg); border-color: transparent; }
.tag { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 5px; white-space: nowrap; }
.tag.pri { background: var(--yellow); color: #1A1400; }
.tag.sm { font-size: 9.5px; padding: 1px 4px; vertical-align: 1px; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 16px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--tab); color: var(--tab-ink); border-color: var(--tab); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--red-fg); }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.big { min-height: 56px; font-size: 18px; border-radius: 16px; font-family: var(--font-display); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.btn.on { background: var(--green); border-color: var(--green); color: #fff; }
.btn.on svg { width: 16px; height: 16px; stroke: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.linkbtn { border: 0; background: transparent; color: var(--tab-fg); font-weight: 700; font-size: 15px; padding: 8px 2px; min-height: 40px; text-decoration: none; }
.linkbtn.danger { color: var(--red-fg); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.foot-actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tip { font-size: 14.5px; color: var(--muted); text-align: center; }
.warn-t { color: var(--yellow-fg); font-weight: 600; }

/* segmented */
.seg-row { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; }
.seg-row > span { font-size: 14px; font-weight: 700; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 8px 4px; font-size: 14.5px; font-weight: 700; color: var(--muted); min-height: 42px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button[aria-pressed="true"].g { background: var(--green); color: #fff; }
.seg button[aria-pressed="true"].y { background: var(--yellow); color: #1A1400; }
.seg button[aria-pressed="true"].r { background: var(--red); color: #fff; }

input.in, .field input {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px;
  padding: 7px 8px; font-size: 16px; min-height: 42px;
}
input.in:focus, .field input:focus { border-color: var(--tab-fg); outline: none; box-shadow: 0 0 0 3px var(--tab-soft); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.inline-field { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.inline-field .field { flex: 1 1 110px; }

/* check-in */
.ci-done { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: var(--r); padding: 10px 14px; font-size: 15px; background: var(--surface); border: 1px solid var(--line); }
.ci-done .light { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
.ci-done.green .light { background: var(--green); } .ci-done.yellow .light { background: var(--yellow); } .ci-done.red .light { background: var(--red); }
.ci-done > span { display: flex; gap: 10px; align-items: center; }
.ci-done .linkbtn { min-height: 32px; padding: 2px 4px; }
.callout { border-radius: var(--r); background: var(--blue-soft); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; }
.callout .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }

/* day chips */
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.daychip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 12px; text-align: left; min-width: 96px; }
.daychip b { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
.daychip small { font-size: 12px; color: var(--muted); }
.daychip[aria-pressed="true"] { border-color: var(--tab-fg); box-shadow: inset 0 0 0 1px var(--tab-fg); }
.daychip.done { opacity: .5; }

/* exercise list */
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.exi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.exi.open { border-color: var(--tab-fg); box-shadow: 0 0 0 1px var(--tab-fg), var(--shadow); }
.exi.complete:not(.open) { background: var(--surface-2); box-shadow: none; }
.exi-h { width: 100%; border: 0; background: transparent; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 14px 10px 10px; text-align: left; }
.thumb { position: relative; width: 48px; height: 56px; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.thumb .mini { width: 40px; height: 54px; }
.mini .sil { fill: var(--mini); }
.mini .mus { stroke: var(--surface-2); stroke-width: 1.4; }
.thumb .badge { position: absolute; left: 3px; top: 3px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--ink); color: var(--surface); font-size: 10.5px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
.exi.open .thumb .badge { background: var(--tab); color: var(--tab-ink); }
.exi.complete .thumb .badge { background: var(--green); color: #fff; }
.thumb .badge svg { width: 10px; height: 10px; stroke: #fff; }
.exi-t { display: flex; flex-direction: column; min-width: 0; }
.exi-t b { font-size: 16.5px; line-height: 1.25; }
.exi-t small { font-size: 13.5px; color: var(--muted); }
.exi.complete .exi-t b { color: var(--muted); }
.exi-c { font-size: 13px; font-weight: 800; color: var(--muted); }
.exi.complete .exi-c { color: var(--green-fg); }
.exi-b { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.ex-why { font-size: 13.5px; color: var(--yellow-fg); font-weight: 700; }
.sugg { display: flex; flex-direction: column; gap: 3px; background: var(--tab-soft); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
.sugg > span:first-child { font-weight: 700; color: var(--ink); }
.howrow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: -4px; }
.howrow .linkbtn { min-height: 34px; padding: 4px 0; display: inline-flex; align-items: center; gap: 6px; }
.howrow .linkbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.how { margin: 0; padding: 10px 12px 10px 32px; background: var(--surface-2); border-radius: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set-hd, .set-row { display: grid; grid-template-columns: 28px minmax(0,1fr) minmax(0,1fr) 52px; gap: 8px; align-items: center; }
.set-hd { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.set-n { font-family: var(--font-display); font-weight: 800; font-size: 19px; text-align: center; color: var(--muted); }
.set-row input.in { text-align: center; padding: 6px 4px; font-weight: 600; }
.chk { height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.chk svg { width: 19px; height: 19px; stroke: var(--muted); }
.set-row.done .chk { background: var(--green); border-color: var(--green); }
.set-row.done .chk svg { stroke: #fff; }
.set-row.done .set-n { color: var(--green-fg); }
.set-row.done input.in { background: var(--green-soft); border-color: transparent; }
.ex-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: space-between; }

/* body map */
.bodymap { width: 100%; max-width: 360px; margin: 0 auto; display: block; height: auto; }
.bodymap .sil { fill: var(--body); }
.bodymap .mus { stroke: var(--surface); stroke-width: 1.1; transition: fill .25s; }
.bodymap .mus[data-act] { cursor: pointer; }
.bodymap .mus.sel { stroke: var(--ink); stroke-width: 2; }
.bodymap .absline { stroke: var(--surface); stroke-width: 1; opacity: .55; fill: none; pointer-events: none; }
.bodymap text { fill: var(--muted); font-family: var(--font-display); font-weight: 800; font-size: 11px; letter-spacing: .14em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.mlist { display: flex; flex-direction: column; gap: 2px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 100px 48px; gap: 10px; align-items: center; padding: 7px 6px; border-radius: 8px; border: 0; background: transparent; text-align: left; font-size: 14.5px; font-weight: 600; }
.mrow:hover { background: var(--surface-2); }
.mrow[aria-pressed="true"] { background: var(--tab-soft); }
.meter { height: 8px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 5px; }
.mrow .pct { text-align: right; font-weight: 800; }
.detail { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.1; overflow-wrap: anywhere; }
.stat span { font-size: 12px; color: var(--muted); }
.budget { display: flex; flex-direction: column; gap: 6px; }
.budget .meter { height: 12px; }

/* volume bars */
.vbars { display: flex; flex-direction: column; gap: 9px; }
.vbar { display: grid; grid-template-columns: 110px minmax(0,1fr) 62px; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; }
.vbar .track { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; }
.vbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.vbar .plan { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--ink); }
.vbar .v { text-align: right; font-weight: 800; }

/* phase strip */
.phases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 520px) { .phases { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; } }
.ph { border-radius: 10px; padding: 8px 2px; text-align: center; background: var(--surface-2); min-width: 0; }
.ph b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 800; line-height: 1; }
.ph span { display: block; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.ph.deload { background: var(--green-soft); }
.ph.cur { background: var(--tab); color: var(--tab-ink); }
.ph.cur span { color: var(--tab-ink); opacity: .85; }
.ph.done { opacity: .45; }
details.day { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
details.day summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
details.day summary::-webkit-details-marker { display: none; }
details.day summary b { font-family: var(--font-display); font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: .03em; }
details.day ol { margin: 0; padding: 0 12px 12px 32px; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
details.card > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
details.card > summary::-webkit-details-marker { display: none; }
.chev { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; flex: 0 0 auto; }
details[open] > summary .chev { transform: rotate(180deg); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.big .chip { font-size: 15px; padding: 9px 14px; }
.chips button.chip[aria-pressed="true"] { background: var(--tab); color: var(--tab-ink); border-color: var(--tab); }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10.5px; font-family: var(--font-body); }
.chart .ln { fill: none; stroke: var(--blue-fg); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.chart .raw { fill: var(--muted); opacity: .5; }
.chart .area { fill: url(#wgrad); }
.chart .gs1 { stop-color: var(--blue-fg); stop-opacity: .28; } .chart .gs2 { stop-color: var(--blue-fg); stop-opacity: 0; }
.chart .end { fill: var(--blue-fg); stroke: var(--surface); stroke-width: 2.5; }
.spark { width: 84px; height: 26px; flex: 0 0 auto; }
.spark polyline { fill: none; stroke: var(--blue-fg); stroke-width: 2; stroke-linejoin: round; }
.spark circle { fill: var(--blue-fg); }
.lift { display: grid; grid-template-columns: minmax(0,1fr) auto 84px; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; font-weight: 600; }
.lift:first-child { border-top: 0; }
.lift .v { font-family: var(--font-display); font-weight: 800; font-size: 21px; text-align: right; line-height: 1; }
.lift .v small { display: block; font-family: var(--font-body); font-weight: 700; font-size: 11.5px; }
.up { color: var(--green-fg); } .down { color: var(--red-fg); }
.hist { display: flex; flex-direction: column; }
.hrow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.hrow:first-child { border-top: 0; }

/* review flags */
.flags { display: flex; flex-direction: column; gap: 8px; }
.flag { border-radius: 12px; background: var(--surface-2); padding: 11px 13px; display: flex; flex-direction: column; gap: 5px; }
.flag h3 { font-size: 16px; font-weight: 800; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.flag p { font-size: 14.5px; }
.flag .fix b { color: var(--green-fg); }
.coach-out { white-space: pre-wrap; font-size: 15px; background: var(--surface-2); border-radius: 10px; padding: 12px; min-height: 48px; }

.banner { background: var(--yellow); color: #1A1400; border-radius: 12px; padding: 9px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 14px; flex-wrap: wrap; }
.banner .btn { background: rgba(255,255,255,.7); border-color: transparent; color: #1A1400; }
.note { background: var(--surface-2); border-radius: 10px; padding: 9px 12px; font-size: 14px; color: var(--muted); }

/* setup */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 14px; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: center; min-height: 64px; box-shadow: var(--shadow); }
.opt .oicon { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.opt .oicon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.opt b { font-size: 18px; }
.opt span.sub { font-size: 14px; color: var(--muted); grid-column: 2; }
.opt[aria-pressed="true"] { border-color: var(--tab); box-shadow: inset 0 0 0 1px var(--tab); }
.opt[aria-pressed="true"] .oicon { background: var(--tab); color: var(--tab-ink); }
.ddots { display: flex; gap: 4px; grid-column: 2; margin-top: 4px; }
.ddots i { width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); font-style: normal; font-size: 10.5px; font-weight: 800; color: var(--muted); display: grid; place-items: center; }
.ddots i.on { background: var(--tab); color: var(--tab-ink); }
.opt.check .oicon { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); }
.opt.check[aria-pressed="true"] .oicon { border-color: var(--tab); }
.opt.check .oicon svg { width: 16px; height: 16px; stroke-width: 3; }
.opt.check { min-height: 54px; }
.lead { color: var(--muted); font-size: 15.5px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.field-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.field input { font-size: 17px; min-height: 48px; }
.setup-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; }
.setup-nav .btn { min-width: 116px; min-height: 52px; font-size: 16px; border-radius: 14px; }
.steps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.steps i { height: 5px; border-radius: 3px; background: var(--band-line); }
.steps i.done { background: var(--band-dim); }
.steps i.cur { background: var(--band-ink); }
.summary { display: flex; flex-direction: column; gap: 10px; }
.summary > div { display: flex; flex-direction: column; gap: 1px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.summary > div:last-child { border-bottom: 0; padding-bottom: 0; }
.summary span { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.summary b { font-size: 17px; }
.summary small { color: var(--muted); font-size: 13.5px; }

/* food */
.macro-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.macro { border-radius: 12px; background: var(--surface-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.macro .mtop { display: flex; align-items: center; gap: 6px; }
.macro b { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1; white-space: nowrap; }
.macro b span { font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--muted); }
.macro span { font-size: 12px; font-weight: 700; color: var(--muted); }
.macro .meter { height: 6px; background: var(--surface); }
.k-p { --mc: var(--blue-fg); } .k-c { --mc: var(--yellow); } .k-f { --mc: var(--red-fg); }
.macro .meter i { background: var(--mc); }
.macro .mtop i { width: 9px; height: 9px; border-radius: 50%; background: var(--mc); display: inline-block; }
.meals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.meal.done { background: var(--surface-2); box-shadow: none; }
.meal-h { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: center; }
.micon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
.micon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.micon.breakfast { background: var(--yellow-soft); color: var(--yellow-fg); }
.micon.main { background: var(--green-soft); color: var(--green-fg); }
.micon.snack { background: var(--blue-soft); color: var(--blue-fg); }
.meal.done .micon { background: var(--green); color: #fff; }
.meal h3 { font-size: 18px; font-weight: 800; line-height: 1.2; }
.mbar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; gap: 2px; }
.mbar i { display: block; height: 100%; }
.mbar .p { background: var(--blue-fg); } .mbar .c { background: var(--yellow); } .mbar .f { background: var(--red-fg); }
.foods { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.foods li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.foods li:first-child { border-top: 0; }
.foods li span:last-child { white-space: nowrap; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.rules li::marker { color: var(--tab-fg); }

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { position: relative; border: 0; background: transparent; padding: 10px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tab::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: transparent; }
.tab[aria-current="page"] { color: var(--c); }
.tab[aria-current="page"]::before { background: var(--c); }
.tab[data-tab="workout"] { --c: var(--red-fg); } .tab[data-tab="food"] { --c: var(--green-fg); }
.tab[data-tab="body"] { --c: var(--blue-fg); } .tab[data-tab="progress"] { --c: var(--yellow-fg); }
body.setup-mode .tabs { display: none; }
body.setup-mode main { padding-block-end: calc(32px + env(safe-area-inset-bottom, 0px)); }

/* sheet + toast */
.scrim { position: fixed; inset: 0; background: rgba(5, 9, 20, .5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 82vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-h { padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.sheet-h .row { justify-content: space-between; flex-wrap: nowrap; }
.sheet-h h2 { font-family: var(--font-display); font-size: 22px; font-weight: 800; text-transform: uppercase; }
.sheet-b { overflow-y: auto; padding: 8px 16px 16px; }
.pick { width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 2px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.pick:first-child { border-top: 0; }
.pick small { color: var(--muted); display: block; font-size: 12.5px; }
.pick .sp { font-size: 12px; font-weight: 800; white-space: nowrap; }
.grp { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 2px 4px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--surface); padding: 11px 18px; border-radius: 12px; font-size: 14.5px; font-weight: 700;
  max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
@media (max-width: 370px) { .band h1 { font-size: 38px; } .bodymap.onband { width: 96px; } .brand { font-size: 20px; } .wk-t small { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* food log */
.logbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.logbtns .btn svg, .fs-tools .btn svg, .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.loglist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.loglist li { display: grid; grid-template-columns: minmax(0, 1fr) auto 36px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.loglist li:first-child { border-top: 0; }
.ln-t { display: flex; flex-direction: column; min-width: 0; }
.ln-t b { font-size: 15px; } .ln-t small { font-size: 12.5px; color: var(--muted); }
.ln-k { font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.ln-x { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 20px; line-height: 1; }
.sect { padding: 4px 2px 0; }
.fs-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ftag { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: var(--tab-soft); color: var(--tab-fg); vertical-align: 1px; }
.pick.est { color: var(--tab-fg); font-weight: 700; }
.pick.est svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; vertical-align: -3px; }
.pick.est small { font-weight: 500; }
.fs-food { display: flex; flex-direction: column; gap: 3px; padding: 6px 0 12px; }
.fs-food b { font-size: 18px; }
.stepper { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; gap: 8px; align-items: end; }
.stepper .btn { min-height: 48px; font-size: 24px; padding: 0; }
.stepper input { text-align: center; font-size: 20px; font-weight: 700; }
.fs-total { display: flex; flex-direction: column; gap: 2px; background: var(--tab-soft); border-radius: 12px; padding: 10px 12px; margin: 12px 0; }
.fs-total b { font-family: var(--font-display); font-weight: 800; font-size: 26px; }
.fs-total span { font-size: 13.5px; color: var(--muted); }
.fs-form { margin: 12px 0; }
.field-row4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.field-row4 label { font-size: 12px; }
.sheet-b > .btn.block, .sheet-b > .row { margin-top: 10px; }
.fs-busy { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 30px 0; text-align: center; color: var(--muted); }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--tab-soft); border-top-color: var(--tab); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn.danger { border-color: var(--red-soft); }

.bc-hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 14px; text-align: center; }
.bc-hero svg { width: 64px; height: 44px; fill: none; stroke: var(--tab-fg); stroke-width: 2.2; stroke-linecap: round; }
.fs-fill { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.fs-fill .btn:only-child { grid-column: 1 / -1; }
label.btn { cursor: pointer; }
.sheet-b > label.btn.block { margin-top: 14px; }

a.btn { text-decoration: none; }
.bc-hero p b { color: var(--ink); }
.center { text-align: center; }

/* live camera */
.cam { position: relative; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; width: 100%; margin: 4px 0 10px; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .guide { position: absolute; left: 10%; right: 10%; top: 28%; height: 44%; border: 3px solid rgba(255,255,255,.92); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
.cam .guide::after { content: ""; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: var(--red); animation: scanline 1.6s ease-in-out infinite alternate; }
@keyframes scanline { from { transform: translateY(-40px); } to { transform: translateY(40px); } }
.cam-hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #fff; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.7); }

/* warm-up + water */
.warm { font-size: 14px; font-weight: 600; background: var(--yellow-soft); color: var(--ink); border-radius: 10px; padding: 8px 12px; }
.wrow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.bottle { width: 64px; height: 128px; display: block; }
.bottle .b-bg { fill: var(--surface-2); }
.bottle .b-water, .bottle .b-wave { fill: var(--blue-fg); opacity: .85; transition: y .4s ease; }
.bottle .b-line { fill: none; stroke: var(--muted); stroke-width: 2.5; }
.bottle .b-cap { fill: var(--muted); }
.wmain { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wmain > b { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.05; }
.cups { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.cup { width: 26px; height: 32px; border: 0; background: transparent; padding: 1px; display: grid; place-items: center; }
.cup svg { width: 22px; height: 28px; }
.cup .cup-line { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; }
.cup .cup-fill { fill: transparent; }
.cup.on .cup-fill { fill: var(--blue-fg); }
.cup.on .cup-line { stroke: var(--blue-fg); }
.wbtns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px; }
.wbtns .btn { flex-direction: column; gap: 0; line-height: 1.1; min-height: 46px; }
.wbtns .btn small { font-size: 11px; font-weight: 600; color: var(--muted); }

.shoplist li span:first-child { display: flex; flex-direction: column; min-width: 0; }
.shoplist li small { font-size: 12px; color: var(--muted); }
.shoplist li span:last-child { font-weight: 700; text-align: right; }

/* exercise notes */
.notebox { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 10px; }
.nb-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.nb-l { font-size: 13px; font-weight: 700; color: var(--muted); }
.seg.sm button { min-height: 36px; font-size: 13.5px; padding: 4px 2px; }
.chip.pain { min-height: 36px; cursor: pointer; }
.chip.pain[aria-pressed="true"] { background: var(--red); color: #fff; border-color: var(--red); }
textarea.in { resize: vertical; font: inherit; font-size: 16px; line-height: 1.35; min-height: 44px; padding: 8px 10px; text-align: left; }
.exi-note { width: 100%; border: 0; border-top: 1px dashed var(--line); background: transparent; display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 14px 9px 70px; text-align: left; font-size: 13px; }
.exi-note .nt { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.exi-note .nl { color: var(--tab-fg); font-weight: 700; white-space: nowrap; }
.lastnote { font-size: 13px; font-weight: 600; color: var(--ink); }
.hnote { display: block; font-size: 13px; color: var(--muted); font-style: italic; margin-top: 2px; }
.hnotes { margin: 4px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--muted); }

/* likes, picks, favorites */
.mrow-act { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mrow-act .btn { white-space: nowrap; }
.mrow-act .icon-act.like { margin-left: auto; }
.mrow-act > span:empty { display: none; }
.icon-act { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; padding: 0; }
.icon-act svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-act.like[aria-pressed="true"] { color: var(--red); border-color: var(--red-soft); background: var(--red-soft); }
.icon-act.like[aria-pressed="true"] svg { fill: currentColor; }
.icon-act.sm { width: 34px; height: 34px; border-radius: 10px; }
.icon-act.sm svg { width: 17px; height: 17px; }
.loglist li { grid-template-columns: minmax(0, 1fr) auto 34px 36px; }
.picks-bar { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 14px; box-shadow: var(--shadow); }
.pb-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--red-soft); color: var(--red); display: grid; place-items: center; }
.pb-ic svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
.pb-t { display: flex; flex-direction: column; min-width: 0; }
.pb-t b { font-size: 15px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.pb-t small { font-size: 12.5px; color: var(--muted); }
.pb-go { color: var(--tab-fg); font-weight: 700; font-size: 14px; }
.ftag.fav { background: transparent; color: var(--red); padding: 0; }
.ftag.fav svg { width: 13px; height: 13px; fill: currentColor; stroke: none; vertical-align: -2px; }
#psheet .foods li { align-items: center; }
.mrow-act .btn.ghost { padding-left: 6px; padding-right: 6px; }
.mrow-act .icon-act { width: 38px; height: 38px; }

/* per-ingredient like / skip */
.foods.ing li { display: grid; grid-template-columns: minmax(0, 1fr) auto 62px; gap: 8px; align-items: center; padding: 4px 0; }
.ing-n { min-width: 0; }
.ing-q { white-space: nowrap; font-size: 13.5px; }
.ing-a { display: flex; gap: 2px; justify-content: flex-end; }
.ia { width: 30px; height: 30px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; border-radius: 8px; opacity: .55; }
.ia:hover { opacity: 1; background: var(--surface-2); }
.ia svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ia.like[aria-pressed="true"] { color: var(--red); opacity: 1; }
.ia.like[aria-pressed="true"] svg { fill: currentColor; }
/* how-it's-figured */
.ttl { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.info-btn { width: 36px; height: 36px; margin: -4px; border: 0; background: transparent; color: var(--muted); display: inline-grid; place-items: center; padding: 0; border-radius: 50%; flex: 0 0 auto; }
.info-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.info-btn:hover { color: var(--tab-fg); background: var(--surface-2); }
.band .info-btn { color: var(--band-dim); width: 24px; height: 24px; vertical-align: -6px; margin-left: 2px; }
.band .info-btn:hover { background: var(--band-line); color: var(--band-ink); }
.info-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.why { border: 0; background: transparent; color: var(--tab-fg); font-weight: 700; font-size: 13.5px; padding: 8px 0 4px; min-height: 36px; margin-bottom: -6px; display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; }
.why svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.info-lead { font-size: 16px; font-weight: 700; }
.info-steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.45; }
.info-steps li::marker { color: var(--tab-fg); font-weight: 800; }
.info-note { margin-top: 14px; }
.rule { display: block; color: var(--muted); }
.rule.on { color: var(--ink); font-weight: 700; }

/* sections inside Advanced */
details.adv > section.sub { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
section.sub h3 { font-size: 16px; font-weight: 800; }
.callout.warn { background: var(--yellow-soft); }
.callout.warn .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }

/* exercise card: tips + setup */
.ex-tools { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ex-tools .linkbtn, .tips .linkbtn { display: inline-flex; align-items: center; gap: 6px; }
.ex-tools svg, .tips .linkbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tips { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.tips .how { background: var(--surface); }
.setup-line { width: 100%; border: 1px dashed var(--line); background: transparent; border-radius: 10px; padding: 8px 10px; min-height: 40px; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 14px; color: var(--ink); }
.setup-line svg { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: var(--muted); stroke-width: 1.8; }
.setup-line span:first-of-type { flex: 1 1 auto; min-width: 0; }
.setup-line .nl { color: var(--tab-fg); font-weight: 700; white-space: nowrap; }
.tips .setup-line { background: var(--surface); }
.setup-edit .in { font-size: 16px; }

/* personal records */
.pr { display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 6px; border-radius: 6px; background: #F4B400; color: #1A1400; font-family: var(--font-body); font-size: 11.5px; font-weight: 800; letter-spacing: .04em; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.pr.sm { min-width: 0; height: 18px; font-size: 10.5px; padding: 0 5px; vertical-align: 2px; }

/* rest timer, docked above the tab bar */
.rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 15;
  width: min(528px, calc(100% - 20px)); background: var(--ink); color: var(--surface); border-radius: 16px; padding: 8px 10px 8px 8px;
  box-shadow: 0 10px 28px rgba(0,0,0,.28); display: flex; flex-direction: column; gap: 8px; }
.rest-top { display: flex; align-items: center; gap: 10px; }
.rest-ring { width: 40px; height: 40px; flex: 0 0 auto; transform: rotate(-90deg); }
.rest-ring circle { fill: none; stroke-width: 4; }
.rest-ring .tr { stroke: color-mix(in srgb, var(--surface) 22%, transparent); }
.rest-ring .fg { stroke: var(--red); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.rest.up .rest-ring .fg { stroke: var(--green); }
.rest-t { flex: 1 1 auto; display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.rest-t b { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: .02em; }
.rest.up .rest-t b { font-family: var(--font-body); font-size: 17px; color: var(--rest-go); }
.rest-t small { font-size: 12px; opacity: .75; font-weight: 600; }
.rest .btn { background: transparent; color: var(--surface); border-color: color-mix(in srgb, var(--surface) 35%, transparent); min-height: 40px; }
.rest .btn.ghost { border-color: transparent; }
.rest-rir { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px 2px; font-size: 13.5px; font-weight: 600; }
.rest-rir .seg { flex: 0 0 auto; width: 176px; background: transparent; border-color: color-mix(in srgb, var(--surface) 30%, transparent); }
.rest-rir .seg button { color: var(--surface); min-height: 38px; font-size: 15px; }
.rest-rir .seg button + button { border-left-color: color-mix(in srgb, var(--surface) 30%, transparent); }
.rest-rir .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
body.resting main { padding-block-end: calc(200px + env(safe-area-inset-bottom, 0px)); }
body.resting .toast { bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
body.setup-mode .rest { display: none; }

/* finish recap */
.rc-name { font-family: var(--font-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.rc-top { display: grid; grid-template-columns: minmax(0, 1fr) 108px; gap: 12px; align-items: center; }
.bodymap.recap { width: 100%; max-width: 230px; height: auto; }
.rc-stats { display: flex; flex-direction: column; gap: 8px; }
.rc-stats > div { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; line-height: 1.1; }
.rc-stats b { font-family: var(--font-display); font-weight: 800; font-size: 28px; }
.rc-stats small { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.rc-stats .gold { background: #FDF0C7; color: #1A1400; }
.rc-stats .gold small { color: #6B4F00; }
.rc-prs { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rc-prs li { display: flex; gap: 10px; align-items: flex-start; }
.rc-prs .pr { margin-top: 2px; }
.rc-pt { display: flex; flex-direction: column; font-size: 14.5px; }
.rc-pt span { color: var(--muted); font-size: 13.5px; }
.sheet.recap .sheet-b { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }

/* one-tap fixes */
.flag .row { margin-top: 4px; }
.fix-done { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 600; color: var(--green-fg); margin-top: 2px; }
.fix-done svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.fix-done span { flex: 1 1 160px; color: var(--ink); }
.fix-done .linkbtn { min-height: 32px; padding: 4px 0; font-size: 14px; }

/* add-food tools: three across inside Claude */
.fs-tools.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.fs-tools.three .btn { padding-inline: 6px; font-size: 13.5px; white-space: nowrap; }

/* best foods for your goal */
.goal-bar .pb-ic { background: var(--green-soft); color: var(--green-fg); }
.goal-bar .pb-ic svg { fill: currentColor; }
.gfs { display: flex; flex-direction: column; }
.gf { display: grid; grid-template-columns: minmax(0, 1fr) 40px 40px; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.gf:first-child { border-top: 0; }
.gf-t { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.gf-t b { font-size: 15px; }
.gf-t small { font-size: 13px; color: var(--muted); }
.gf-t small b { color: var(--ink); font-size: 13px; }
.gf-t .gf-why { color: var(--ink); opacity: .85; }
.gf .icon-act { width: 40px; height: 40px; }
.gf .icon-act.add { font-size: 22px; font-weight: 700; color: var(--green-fg); line-height: 1; }
#gsheet .rules { margin-top: 2px; }
.gf-key { padding-top: 10px; }
.lbl-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.unitseg { width: 104px; flex: 0 0 auto; }
.unitseg button { min-height: 34px; padding: 4px; font-size: 14px; }
.unit-l { font-size: 14.5px; font-weight: 700; }
.rest-rir .rr-msg { font-weight: 800; }

/* coach */
.iconbtn.coachbtn svg { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.sheet.coach { height: 82vh; }
#coach-log { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding-top: 12px; }

  const frac = Math.min(1, Math.max(1, Math.ceil((now - first) / 864e5)) / 7);

  const nDays = daysFor(st.profile).length;
  if (frac >= 1 && recent.length < Math.max(2, nDays - 1)) {
    flags.push({ sev: 'warn', title: 'Only ' + recent.length + ' session' + (recent.length === 1 ? '' : 's') + ' in 7 days',
      problem: 'Your plan is ' + nDays + ' sessions a week, so every muscle is getting less than planned.',
      fix: 'The plan rotates instead of following the calendar. Do the next day on the list; no need to restart the week.' });
  }

  if (recent.length >= 2) {
    /* first week: judge against the plan for the days you've actually trained, not a full week */
    let doneVol = null;
    if (frac < 1) {
      doneVol = {};
      recent.forEach(x => { if ((x.split || 5) !== nDays || x.day == null) return; dayPlan(st, Math.min(8, x.week || 1), x.day, { level: 'green', back: 'good' }, null).forEach(it => { for (const mm in EX[it.id].m) doneVol[mm] = (doneVol[mm] || 0) + EX[it.id].m[mm] * it.sets; }); });
    }
    prioOf(st.profile).forEach(m => {
      const need = doneVol ? (doneVol[m] || 0) : plan.vol[m], got = vol[m];
      if (need >= 2 && got < need * 0.8) {
        const exs = excludedSet(st.profile);
        const pick = Object.keys(EX).filter(k => primaryOf(k) === m && !exs.has(k)).sort((a, b) => EX[a].sp - EX[b].sp)[0];
        const addN = Math.max(2, Math.min(4, Math.ceil(need - got)));
        flags.push({ sev: 'bad', title: MUSCLES[m].n + ' behind plan', problem: MUSCLES[m].n + ' got ' + fmt1(got) + ' of ' + fmt1(need) + ' planned sets ' + (frac < 1 ? 'so far' : 'this week') + '. This is one of your focus muscles.',
          fix: 'Add ' + addN + ' sets of ' + (pick ? EX[pick].n.toLowerCase() : 'a ' + MUSCLES[m].n.toLowerCase() + ' exercise') + ' to your next session' + (pick && EX[pick].sp <= 0.1 ? '. It puts almost no load on your lower back.' : '.'),
          apply: pick ? { k: 'add', id: pick, sets: addN } : null });
      }
    });
  }

  const bl = backLoad(sets), budget = (st.profile && st.profile.backBudget) || 24;
  if (bl.total > budget) {
    const top = Object.entries(bl.by).sort((a, b) => b[1] - a[1])[0];
    const alt = top ? safestAlt(top[0], st.profile, 0.5, dayMates(st.profile, top[0])) : null;
    flags.push({ sev: 'bad', title: 'Lower-back load over budget', problem: 'Back load hit ' + bl.total + ' of ' + budget + ' points in 7 days. Biggest source: ' + (top ? EX[top[0]].n : '—') + '.',
      fix: alt ? 'Swap ' + EX[top[0]].n + ' for ' + EX[alt].n + ' for the next 7 days (same muscle, ' + EX[alt].sp + ' points a set instead of ' + EX[top[0]].sp + ').' : 'Cut the heaviest back-loading lift this week.',
      apply: alt ? { k: 'swap7', from: top[0], to: alt } : null });
  } else if (bl.total > budget * 0.85) {
    flags.push({ sev: 'warn', title: 'Lower-back load near budget', problem: 'Back load is at ' + bl.total + ' of ' + budget + ' points.',
      fix: 'Pick the chest-supported or machine option for any row, shrug or press until the 7-day total drops.' });
  }

  const reds = Object.keys(st.checkins || {}).filter(k => new Date(k + 'T12:00:00').getTime() >= since && readiness(st.checkins[k]).level === 'red').length;
  if (reds >= 2) {
    flags.push({ sev: 'warn', title: 'Recovery running low', problem: reds + ' red check-ins this week (poor sleep, low energy or a sore back).',
      fix: ptr.week < 4 ? 'Pull the deload forward: run an easy deload week now, then come back to week ' + ptr.week + '.' : 'Take one extra rest day and get 7+ hours of sleep two nights in a row before your next hard session.',
      apply: ptr.week < 4 && !st.sessions.some(x => x.deload && x.at >= since) && !deloadState(st) ? { k: 'deload' } : null });
  }

  const wt = weightTrend(st.weights || {}, now, st.profile && st.profile.scaleSince);
  const G = GOALS[(st.profile && st.profile.goal) || 'leanbulk'];
  if (wt) {
    const lo = wt.latest * G.lo, hi = wt.latest * G.hi;
    const goal = (st.profile && st.profile.goal) || 'leanbulk';
    const trendTxt = 'Trend is ' + sign(r1(toU(wt.perWeek))) + ' ' + UNIT + ' a week. Target is ' + sign(r1(toU(lo))) + ' to ' + sign(r1(toU(hi))) + '.';
    if (wt.perWeek < lo - 0.05) {
      const add = goal === 'leanbulk' ? 200 : 150;
      flags.push({ sev: 'warn', title: { leanbulk: 'Gaining too slowly', cut: 'Losing weight too fast', recomp: 'Losing weight' }[goal] || 'Below your goal range', problem: trendTxt,
        fix: goal === 'leanbulk' ? 'Add 200 calories a day, mostly carbs around training, and recheck in 2 weeks.' : goal === 'cut' ? 'Losing this fast costs muscle. Add 150 calories a day and recheck in 2 weeks.' : 'Add 150 calories a day and recheck in 2 weeks.',
        apply: { k: 'kcal', d: add } });
    } else if (wt.perWeek > hi + 0.05) {
      const cut = goal === 'cut' ? 200 : 150;
      flags.push({ sev: 'warn', title: { leanbulk: 'Gaining too fast', cut: 'Not losing fast enough', recomp: 'Gaining weight' }[goal] || 'Above your goal range', problem: trendTxt,
        fix: goal === 'leanbulk' ? 'Gaining faster than muscle can grow means extra fat. Drop 150 calories a day and recheck in 2 weeks.' : goal === 'cut' ? 'Cut 200 calories a day and recheck in 2 weeks.' : 'Drop 150 calories a day and recheck in 2 weeks.',
        apply: { k: 'kcal', d: -cut } });
    }
    else flags.push({ sev: 'good', title: 'Body weight on target', problem: 'Trend is ' + sign(r1(toU(wt.perWeek))) + ' ' + UNIT + ' a week, inside your goal range.', fix: 'Keep intake where it is.' });
  }

  if (st.food) {
    const ws = weightSeries(st.weights || {}); const wLb = ws.length ? ws[ws.length - 1].lb : (st.profile && st.profile.startWeight);
    const days = Object.keys(st.food).filter(k => new Date(k + 'T12:00:00').getTime() >= since && +st.food[k].water > 0);
    if (days.length >= 3 && wLb) {
      const avg = Math.round(days.reduce((a, k) => a + +st.food[k].water, 0) / days.length);
      const tgt = waterTarget(wLb, false) + 8;
      const L = oz => Math.round(oz * 0.0295735 * 10) / 10, met = UNIT === 'kg', near = Math.min(tgt, 16 * ((st.profile && st.profile.meals) || 4) + 16);
      if (avg < tgt * 0.75) flags.push({ sev: 'warn', title: 'Water is low', problem: 'You averaged ' + (met ? L(avg) + ' L' : avg + ' oz') + ' on the days you logged. Your target is about ' + (met ? L(tgt) + ' L' : tgt + ' oz') + '.',
        fix: (met ? 'Drink a 500 ml bottle' : 'Drink a 16 oz bottle') + ' with every meal and one during training. That alone gets you close to ' + (met ? L(near) + ' L' : near + ' oz') + '.' });
    }
  }

  const painCount = {};
  st.sessions.filter(x => x.at >= now - 14 * 864e5).forEach(x => Object.keys(x.exNotes || {}).forEach(id => { if (x.exNotes[id].pain) painCount[id] = (painCount[id] || 0) + 1; }));
  Object.keys(painCount).forEach(id => {
    if (!EX[id]) return;
    const alt = safestAlt(id, st.profile, null, dayMates(st.profile, id));
    flags.push({ sev: painCount[id] >= 2 ? 'bad' : 'warn', title: 'Pain on ' + EX[id].n, problem: 'You flagged pain ' + (painCount[id] >= 2 ? painCount[id] + ' times' : 'once') + ' in the last 2 weeks.',
      fix: painCount[id] >= 2 ? ('Stop doing it for now' + (alt ? ': swap to ' + EX[alt].n + '.' : '.') + ' If the pain is sharp or lasts more than a few days, see a doctor or physical therapist.') : 'Go 10% lighter next time and watch the form tips. If it hurts again, swap it.',
      apply: painCount[id] >= 2 && alt ? { k: 'swap', from: id, to: alt } : null });
  });

  const hist = liftHistory(st, true);
  Object.keys(hist).forEach(id => {
    const h = hist[id];
    if (h.length < 3 || !EX[id] || !(EX[id].inc > 0)) return;
    const [a, b, c] = h.slice(-3).map(x => x.v);
    if (c <= Math.max(a, b) && Math.abs(c - a) / a < 0.02) {
      flags.push({ sev: 'warn', title: EX[id].n + ' has stalled', problem: 'No strength gain across your last 3 sessions (about ' + Math.round(toU(c)) + ' ' + UNIT + ' estimated max).',
        fix: 'Next time, add ' + fmtWU(incOf(EX[id])) + ' and work at the bottom of the ' + EX[id].r[0] + '–' + EX[id].r[1] + ' rep range. If it stalls again, swap the variation next block.' });
    }
  });

  if (!flags.some(f => f.sev !== 'good') && recent.length >= Math.min(3, Math.ceil(nDays * frac))) {
    flags.unshift({ sev: 'good', title: 'On track', problem: recent.length + ' sessions, priority muscles at or above plan, back load inside budget.', fix: 'Run the next session as written.' });
  }
  return { flags, recent, plan, vol, back: bl, weight: wt };
}
function fmt1(x) { return (Math.round(x * 10) / 10).toString(); }
function r1(x) { return Math.round(x * 10) / 10; }
function sign(x) { return (x > 0 ? '+' : '') + x; }

}

/* ---------- charts ---------- */
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function weightChart(series) {
  const pts = series.slice(-60);
  if (pts.length < 2) return '';
  const W = 340, H = 150, L = 34, Rr = 10, T = 10, B = 24;
  const ys = pts.map(p => p.lb);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max(0.6, (hi - lo) * 0.15); lo -= pad; hi += pad;
  const step = niceStep((hi - lo) / 3);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const x = t => L + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (W - L - Rr);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) g += '<line class="grid" x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + (+v.toFixed(1)) + '</text>';
  const avg = pts.map(p => { const win = pts.filter(q => q.t <= p.t && q.t > p.t - 7 * 864e5); return { t: p.t, v: win.reduce((a, b) => a + b.lb, 0) / win.length }; });
  const line = avg.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = line + ' L' + x(t1).toFixed(1) + ' ' + (H - B) + ' L' + x(t0).toFixed(1) + ' ' + (H - B) + ' Z';
  const dots = pts.map(p => '<circle class="raw" cx="' + x(p.t).toFixed(1) + '" cy="' + y(p.lb).toFixed(1) + '" r="2.4"/>').join('');
  const last = avg[avg.length - 1];
  const fd = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Body weight: dots are weigh-ins, line is the 7-day average">' + g +
    '<defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="gs1"/><stop offset="1" class="gs2"/></linearGradient></defs><path class="area" d="' + area + '"/>' + dots + '<path class="ln" d="' + line + '"/><circle class="end" cx="' + x(last.t).toFixed(1) + '" cy="' + y(last.v).toFixed(1) + '" r="4.5"/>' +
    '<text class="ax" x="' + L + '" y="' + (H - 6) + '">' + fd(t0) + '</text><text class="ax" x="' + (W - Rr) + '" y="' + (H - 6) + '" text-anchor="end">' + fd(t1) + '</text></svg>';
}
function spark(vals) {
  if (vals.length < 2) return '<svg class="spark" viewBox="0 0 84 26"></svg>';
  const lo = Math.min(...vals), hi = Math.max(...vals), rng = hi - lo || 1;
  const p = vals.map((v, i) => [2 + i / (vals.length - 1) * 78, 22 - (v - lo) / rng * 18]);
  const e = p[p.length - 1];
  return '<svg class="spark" viewBox="0 0 84 26" aria-hidden="true"><polyline points="' + p.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') + '"/><circle cx="' + e[0].toFixed(1) + '" cy="' + e[1].toFixed(1) + '" r="2.6"/></svg>';
}

/* ================= WORKOUT ================= */

    return band({ eyebrow: 'Block ' + ptr.block + ' complete', title: '8 weeks done', sub: 'Every session is logged. Start the next 8 weeks with your new weights.' }) +

  const effort = W.phase === 'Deload' ? 'Easy week: lighter weights, fewer sets.' : 'Stop each set with <b>' + tank(Math.min(5, rLo)) + '</b> left in the tank' + (rHi > rLo ? ' (' + tank(Math.min(5, rHi)) + ' on heavy lifts)' : '') + '.';

  });

  if (staleDraft(d)) {

  }
  // check-in
  const ci = st.checkins[todayKey()] || {};
  const answered = ['sleep', 'energy', 'back'].filter(k => ci[k]).length;

  const backTxt = R.back === 'sore' ? ' Back-loading lifts swapped out.' : R.back === 'tight' ? ' Heavy back-loading lifts swapped out.' : '';

  if (answered === 3 && !S.editCheckin) {

  // recovery swap suggestion
  const rec = recovery(st, Date.now(), extra);
  const mainMuscles = [...new Set(ctx.items.slice(0, 3).map(it => primaryOf(it.id)))];
  const worst = mainMuscles.reduce((acc, m) => rec.R[m] < acc.r ? { m, r: rec.R[m] } : acc, { m: null, r: 101 });
  if (!draftHasDone(d) && worst.m && worst.r < 60) {
    let best = null;
    for (let i = 0; i < ctx.days.length; i++) {
      if (i === ctx.day || ptr.done.has(i)) continue;
      const mm = Math.min(...dayPlan(st, ctx.planWeek, i, ctx.Rp, null).slice(0, 3).map(it => rec.R[primaryOf(it.id)]));

    const note = d && d.notes && d.notes[it.key];
    if (!isOpen && doneN > 0) h += '<button class="exi-note" data-act="opennote">' + (noteBits(note) ? '<span class="nt">' + esc(noteBits(note)) + '</span><span class="nl">Edit</span>' : '<span class="nl">+ Add a note: form, pain, how it felt</span>') + '</button>';
    if (isOpen) {
      let why = '';
      it.why.forEach(w => {

        else if (w.kind === 'excluded') why = 'Replaces ' + EX[w.from].n + ', which you asked to avoid.';
        else if (w.kind === 'manual') why = 'Your swap for ' + EX[w.from].n + '.';
        else if (w.kind === 'temp') why = 'Replaces ' + EX[w.from].n + ' until ' + fmtDate(w.until) + ' to keep your back load under its limit.';
        else if (w.kind === 'queued') why = 'Added from This week\u2019s fixes to catch up your focus muscle.';
      });
      const lastTxt = sg.last ? 'Last time: ' + sg.last.sets.map(s => (s.w ? lb(s.w) + '×' : '') + s.r).join(', ') : '';
      const plates = sg.w && ex.bar ? platesText(sg.w, ex.bar) : '';
      let warm = '';
      if (idx === 0 && (isHeavy(it.id) || COMPOUND.has(it.id))) {
        const A = ageAdj(st.profile), step = incOf(ex) || (UNIT === 'kg' ? 2.5 / KG : 5), ww = sg.w && ex.inc > 0 ? sg.w : null;
        const pct = A.warm >= 3 ? [[0.4, 10], [0.6, 6], [0.8, 3]] : A.warm === 2 ? [[0.5, 10], [0.75, 5]] : [[0.6, 8]];

      }
      /* the card shows what you need mid-set; how-to steps and machine setup open from "How to do it" */
      const XS = st.profile.exSetup || {}, sv = hasSetup(it.id) ? XS[gymOf(st.profile) + ':' + it.id] || (gymOf(st.profile) === 'us' ? XS[it.id] : '') || '' : '';
      const tipsOpen = S.tips === it.key;
      h += '<div class="exi-b">' + (why ? '<p class="ex-why">' + esc(why) + '</p>' : '') +
        (sv && !tipsOpen ? '<button class="setup-line" data-act="exsetup">' + GEAR + '<span><b>' + esc(sv) + '</b></span></button>' : '') +
        (warm ? '<p class="warm">' + esc(warm) + '</p>' : '') +

        (sg.last && noteBits(sg.last.note) ? '<span class="lastnote">Your note last time: ' + esc(noteBits(sg.last.note)) + '</span>' : '') +
        '<button class="why" data-act="info" data-k="weight" data-m="' + it.key + '">' + ICON_INFO + 'Why this weight?</button></div>' +
        '<div class="sets"><div class="set-hd"><span>Set</span><span>' + (it.id === 'pullup' ? 'Added ' + UNIT : UNIT) + '</span><span>Reps</span><span></span></div>';
      const n = Math.max(it.sets, logs.length);
      const best = bestBefore(st, it.id);
      for (let i = 0; i < n; i++) {
        const l = logs[i] || {};
        const pr = l.done && prKind({ w: +l.w || 0, r: +l.r || 0, rir: l.rir }, best);
        const wv = inN(l.w != null && l.w !== '' ? l.w : (sg.w != null && ex.inc > 0 ? sg.w : (ex.inc === 0 ? 0 : '')));
        const prev = sg.last && !sg.comeback && W.phase !== 'Deload' && ctx.R.level !== 'red' ? sg.last.sets[i] : null;
        const rowW = l.w != null && l.w !== '' ? +l.w : (sg.w != null && ex.inc > 0 ? sg.w : (ex.inc === 0 ? 0 : null));
        const ghost = !l.done && (l.r == null || l.r === '') && prev && prev.r > 0 && rowW != null && Math.abs((+prev.w || 0) - rowW) < 0.6 ? prev.r : '';
        h += '<div class="set-row' + (l.done ? ' done' : '') + '" data-key="' + it.key + '" data-i="' + i + '"><span class="set-n">' + (pr ? '<span class="pr" title="' + ({ weight: 'Heaviest ever', e1rm: 'Best estimated max', reps: 'Most reps' })[pr] + '">PR</span>' : (i + 1)) + '</span>' +
          '<input id="w-' + it.key + '-' + i + '" class="in" inputmode="decimal" aria-label="Set ' + (i + 1) + ' weight" data-f="w" value="' + esc(wv) + '">' +
          '<input id="r-' + it.key + '-' + i + '" class="in' + (ghost ? ' ghost' : '') + '" inputmode="numeric" aria-label="Set ' + (i + 1) + ' reps" data-f="r"' + (ghost ? ' data-ghost="' + ghost + '"' : '') + ' placeholder="' + (ghost || it.lo + '–' + it.hi) + '" value="' + esc(l.r == null ? '' : l.r) + '">' +
          '<button class="chk" data-act="check" aria-label="Set ' + (i + 1) + ' done" aria-pressed="' + !!l.done + '">' + CHECK + '</button></div>';
      }
      const nt = note || {};
      const noteOpen = S.noteOpen === it.key || !!noteBits(note);
      h += '</div>';
      if (noteOpen) h += '<div class="notebox"><div class="nb-row"><span class="nb-l">Form</span><div class="seg sm" role="group" aria-label="How was your form">' +
        FORMS.map(([v, n]) => '<button type="button" class="' + ({ good: 'g', ok: 'y', off: 'r' })[v] + '" data-act="exform" data-v="' + v + '" aria-pressed="' + (nt.form === v) + '">' + n + '</button>').join('') + '</div>' +

        '<a class="linkbtn" href="' + esc(videoUrl(it.id)) + '" target="_blank" rel="noopener">' + ICON_PLAY + 'Watch a video</a></div>';
      if (tipsOpen) {
        h += '<div class="tips"><p class="muted xs">Works ' + esc(muscleNames(it.id)) + '.</p>' +
          (HOW[it.id] ? '<ol class="how">' + HOW[it.id].map(c => '<li>' + esc(c) + '</li>').join('') + '</ol>' : '') +
          (hasSetup(it.id) ? (S.setupEdit === it.key
            ? '<div class="inline-field setup-edit"><div class="field"><label for="xs-' + it.key + '">Seat, pad and pin settings</label><input id="xs-' + it.key + '" class="in" maxlength="80" autocomplete="off" value="' + esc(sv) + '" placeholder="e.g. Seat 4, back pad 2, handles low"></div><button class="btn primary" data-act="exsetupsave">Save</button></div>'
            : '<button class="setup-line" data-act="exsetup">' + GEAR + (sv ? '<span><b>' + esc(sv) + '</b></span><span class="nl">Edit</span>' : '<span class="nl">Save your seat and pad settings</span>') + '</button>') : '') +
          '</div>';

    (d && d.removed && d.removed.length ? '<button class="linkbtn" data-act="unskip">Bring back skipped (' + d.removed.length + ')</button>' : '') +

    }).join('') + '</div>';
  }
  return h;
}
